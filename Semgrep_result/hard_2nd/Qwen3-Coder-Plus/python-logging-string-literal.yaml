rules:
- id: python-logging-string-literal
  message: For logging functions that expect a pattern-string, always call them with
    a string literal (not f-string) as first argument.
  languages:
  - python
  severity: WARNING
  pattern-either:
  - patterns:
    - pattern-regex: "(?:logging|logger|log)\\.(?:debug|info|warning|error|critical|exception)\\(\\s*f[\"']"
    - pattern-not-regex: "(?:logging|logger|log)\\.(?:debug|info|warning|error|critical|exception)\\(\\s*f[\"'].*(?:%s|%d|%r|%f|%i)"
  - patterns:
    - pattern-regex: "(?:logging|logger|log)\\.log\\([^,]+,\\s*f[\"']"
    - pattern-not-regex: "(?:logging|logger|log)\\.log\\([^,]+,\\s*f[\"'].*(?:%s|%d|%r|%f|%i)"
  - pattern: logging.error(traceback.format_exc())
  metadata:
    syntax_$METHOD: name_matches_regex('^(debug|info|warning|error|critical|exception|log)$')
    syntax_$FORMAT: is_not_string_literal
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom pattern to detect non-literal first arguments
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to identify logging functions and string
          literal constraints
    original_description: For logging functions that expect a pattern-string, always
      call them with a string literal (not f-string) as first argument.
    iteration2_note: Narrowed to only detect f-string and dynamic expression first arguments via pattern-regex. Removed broad pattern-either that matched all logging calls including string literal ones. 108 findings→~98(estimated f-string only), 50% precision→higher per evaluate2.