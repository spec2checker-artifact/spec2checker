rules:
- id: shell-avoid-unquoted-array-expansion
  message: Avoid unquoted command expansion in array assignments; won't work correctly
    if output contains special characters. Use readarray instead.
  languages:
  - bash
  severity: ERROR
  patterns:
  - pattern: $ARRAY=($($CMD))
  - metavariable-type:
      metavariable: $ARRAY
      type: expr
  - metavariable-type:
      metavariable: $CMD
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires semgrep's bash parser
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Avoid unquoted command expansion in array assignments; won't
      work correctly if output contains special characters. Use readarray instead.
