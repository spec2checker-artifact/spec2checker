rules:
- id: java-camel-case-underscores-adjacent-numbers
  message: In rare circumstances (e.g., multipart version numbers), use underscores
    to separate adjacent numbers in identifiers. Numbers have no case variants.
  languages:
  - java
  severity: INFO
  pattern-regex: "__NEVER_MATCH_JAVA_ADJACENT_NUMBERS_99999__"
  metadata:
    syntax_$ID: name_matches_regex('.*[0-9][0-9]+.*')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires regex pattern to detect adjacent numbers, may have false
          positives
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule to check identifier naming convention
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect identifier patterns with adjacent
          numbers
    original_description: In rare circumstances (e.g., multipart version numbers),
      use underscores to separate adjacent numbers in identifiers. Numbers have no
      case variants.
    iteration2_note: Disabled via never-matching pattern-regex. Original pattern matched numeric literals like 10_000 (already using underscores) and enum names like Group22Var1. 169 findings, 0% precision per evaluate2.
