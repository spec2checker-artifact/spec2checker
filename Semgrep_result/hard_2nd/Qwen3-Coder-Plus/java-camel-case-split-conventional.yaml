rules:
- id: java-camel-case-split-conventional
  message: If a word already has conventional camel-case appearance (e.g., 'AdWords'),
    split into constituent parts ('ad words'). Does not apply to 'iOS'.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: $IDENT
  - metavariable-regex:
      metavariable: $IDENT
      regex: ^(?!iOS$)(AdWords|PdfViewer|XmlParser|HttpClient|UrlBuilder|JsonSerializer|HtmlRenderer|CssParser|SqlQuery|ApiClient|IoDevice|IpAddress|DbConnection|SshKey|TcpSocket|UdpPacket|PngImage|GifAnimation|SvgGraphic|Mp3Player|Mp4Video|WifiAdapter|BluetoothDevice|ChromeOS|MacOS|WebBrowser|HttpPost|HttpGet|OAuth2|OpenSSL|NoSQL|RESTApi|SOAPClient|LDAPServer|IMAPClient|POP3Server|SMTPClient|FTPClient|SSHServer|VPNConnection|DNSResolver|RFCCompliant|ISBNNumber|SSNValidator|EINChecker|UUIDGenerator|GUIDFactory|QrCode|VCard|MimeMessage|Base64|HexDump|JwtToken|Crc32|Sha256|AesKey|RsaKey|DesCipher|PemFormat|CerFile|Pkcs7|X509Cert|TlsConnection|SslContext|PgpKey|MimeType|HttpServlet|JspPage|AspNet|PhpScript|RubyOnRails|PythonModule|JavaApplet|CppHeader|CsProj|GoPackage|RustCrate|SwiftClass|KotlinFun|ScalaObj|GroovyBean|ClojureNs|HaskellModule|ErlangApp|FSharpVal|OcamlType|RPackage|CMakeList|MakefileRule|GradleTask|MavenPom|AntTarget|DockerContainer|KubernetesPod|JenkinsJob|GitRepo|SvnCommit|MercurialPatch|BazaarBranch)$
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex-based detection only; may have false positives/negatives
          on complex identifiers
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule implementation for specific camel-case splitting
          logic
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to implement the specific splitting convention
          and 'iOS' exception
    original_description: If a word already has conventional camel-case appearance
      (e.g., 'AdWords'), split into constituent parts ('ad words'). Does not apply
      to 'iOS'.
