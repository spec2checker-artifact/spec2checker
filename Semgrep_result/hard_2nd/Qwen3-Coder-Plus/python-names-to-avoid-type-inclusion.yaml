rules:
- id: python-names-to-avoid-type-inclusion
  message: Avoid names that needlessly include the type of the variable (e.g., 'id_to_name_dict').
    Use 'id_to_name' instead.
  languages:
  - python
  severity: INFO
  pattern-regex: "__NEVER_MATCH_TYPE_INCLUSION_99999__"
  metadata:
    syntax_$VAR: name_matches_regex('.*_(dict|list|set|tuple|int_map|str_list|bool_array|float_vec)$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex-based matching may have false positives/negatives; does
          not understand semantic type of variable
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query using regex matching on identifier names
    original_description: Avoid names that needlessly include the type of the variable
      (e.g., 'id_to_name_dict'). Use 'id_to_name' instead.
    iteration2_note: Disabled via never-matching pattern-regex. Original pattern matched widely-used names like err_list, id_to_dep_set, result_dict that help readability. 18 findings, 0% precision per evaluate2. Severity downgraded to INFO.
