rules:
- id: javascript-throw-error-only
  message: Always throw `Error` or subclasses; never throw string literals or other
    objects. Always use `new Error()`. Applies to `Promise.reject` as well.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: throw $EXPR;
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_$EXPR: not matches_regex('^new\s+Error\b')
    type_constraint_$EXPR: not is_subtype_of('Error')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: true
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Type resolution for subclasses may be limited.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: Requires custom query to check `Promise.reject` and `throw` statements.
    original_description: Always throw `Error` or subclasses; never throw string literals
      or other objects. Always use `new Error()`. Applies to `Promise.reject` as well.
