rules:
- id: java-ignoring-exception-must-comment
  message: When an exception is caught and no action is taken, a comment explaining
    the reason must be present.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: "catch ($TYPE $VAR) {\n    ...\n}"
  - metavariable-type:
      metavariable: $TYPE
      type: type
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    syntax_catch_block: contains_no_comment
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep can detect empty catch blocks but comment detection is
          limited to pattern matching.
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD's EmptyCatchBlock rule can be configured to require comments,
          but it's a configurable option, not a default.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: CodeQL can find empty catch blocks, but precise detection of
          explanatory comments requires custom query logic.
    original_description: When an exception is caught and no action is taken, a comment
      explaining the reason must be present.
