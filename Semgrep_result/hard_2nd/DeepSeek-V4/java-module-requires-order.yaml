rules:
- id: java-module-requires-order
  message: In a module-info.java file, the 'transitive' modifier must appear before
    the 'static' modifier in a requires directive.
  languages:
  - java
  severity: ERROR
  patterns:
  - pattern: requires static transitive $MODULE;
  - metavariable-type:
      metavariable: $MODULE
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom rule implementation for Java module syntax.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query for Java module syntax.
    original_description: In a module-info.java file, the 'transitive' modifier must
      appear before the 'static' modifier in a requires directive.
