rules:
- id: javascript-arrow-function-body
  message: Arrow function body should be a block or a single expression. Use `void`
    before a single function call if no return value is needed.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $ARGS => $BODY
  - metavariable-type:
      metavariable: $ARGS
      type: expr
  - metavariable-type:
      metavariable: $BODY
      type: expr
  metadata:
    syntax_$BODY: is_call_expression AND not_preceded_by_void
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise AST matching for `void` and block detection
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for `void` usage pattern
    original_description: Arrow function body should be a block or a single expression.
      Use `void` before a single function call if no return value is needed.
