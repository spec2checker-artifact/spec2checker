rules:
- id: shell-package-function-names
  message: Function names in packages should use '::' as a separator between package
    and function name.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: "function $FUNC {\n    ...\n}"
  - metavariable-type:
      metavariable: $FUNC
      type: function
  metadata:
    syntax_$FUNC: name_matches_regex('^[a-zA-Z_][a-zA-Z0-9_]*$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern matches all function definitions; requires additional
          logic to identify package context and enforce '::' usage.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis.
    original_description: Function names in packages should use '::' as a separator
      between package and function name.
