rules:
- id: python-logging-string-literal
  message: For logging functions that expect a pattern-string, always call them with
    a string literal (not f-string) as first argument.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: logging.$METHOD($FSTRING, ...)
    - pattern: logging.getLogger(...).$METHOD($FSTRING, ...)
    - pattern: $LOGGER.$METHOD($FSTRING, ...)
  - metavariable-regex:
      metavariable: $METHOD
      regex: ^(debug|info|warning|error|critical|exception|log)$
  - pattern-not: logging.$METHOD("...", ...)
  - pattern-not: logging.getLogger(...).$METHOD("...", ...)
  - pattern-not: $LOGGER.$METHOD("...", ...)
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom pattern to detect non-literal first arguments
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to identify logging functions and string
          literal constraints
    original_description: For logging functions that expect a pattern-string, always
      call them with a string literal (not f-string) as first argument.
