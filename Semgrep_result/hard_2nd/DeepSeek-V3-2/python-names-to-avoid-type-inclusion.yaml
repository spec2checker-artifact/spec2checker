rules:
- id: python-names-to-avoid-type-inclusion
  message: Avoid names that needlessly include the type of the variable (e.g., 'id_to_name_dict').
    Use 'id_to_name' instead.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: $VAR = ...
  - metavariable-regex:
      metavariable: $VAR
      regex: .*_(dict|list|set|tuple|int|str|bool|float|string|iterator)$
  - pattern-not: 'self.$VAR = ...'
  - pattern-not: '_$VAR = ...'
  - pattern-not: '$VAR = None'
  - pattern-not: '$VAR = True'
  - pattern-not: '$VAR = False'
  - pattern-not: '$VAR = $NUM'
  - pattern-not: help_string = ...
  - pattern-not: test_result = ...
  - pattern-not: exit_status = ...
  - pattern-not: xml_buffer = ...
  - pattern-not: default_as_str = ...
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex-based matching may have false positives/negatives; does
          not understand semantic type of variable
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query using regex matching on identifier names
    original_description: Avoid names that needlessly include the type of the variable
      (e.g., 'id_to_name_dict'). Use 'id_to_name' instead.