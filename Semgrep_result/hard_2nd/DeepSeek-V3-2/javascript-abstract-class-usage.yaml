rules:
- id: javascript-abstract-class-usage
  message: Abstract classes and methods should be annotated with `@abstract`. Do not
    use `goog.abstractMethod`.
  languages:
  - javascript
  severity: WARNING
  pattern: goog.abstractMethod()
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern matches only the literal call; may miss other forms of
          goog.abstractMethod usage.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect goog.abstractMethod and suggest
          @abstract annotation.
    original_description: Abstract classes and methods should be annotated with `@abstract`.
      Do not use `goog.abstractMethod`.
