rules:
- id: shell-local-command-substitution-exit-code
  message: Always separate `local` declaration and assignment when assignment uses
    command substitution, because `local` masks exit code.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: local $VAR=$(...)
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    syntax_$VAR: assignment_uses_command_substitution
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching for command substitution syntax
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Always separate `local` declaration and assignment when
      assignment uses command substitution, because `local` masks exit code.
