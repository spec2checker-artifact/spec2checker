rules:
- id: shell-set-constant-readonly
  message: Detect when a variable is set (potentially at runtime or conditionally)
    but not made readonly immediately afterwards.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: '$VAR="..."

      ...'
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    syntax_$VAR: not_followed_by('readonly $VAR')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep for shell may have limited scope tracking; pattern may
          not correctly enforce 'immediately afterwards' across complex control flow.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis.
    original_description: Detect when a variable is set (potentially at runtime or
      conditionally) but not made readonly immediately afterwards.
