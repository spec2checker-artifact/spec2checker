rules:
- id: python-logging-string-literal
  message: For logging functions that expect a pattern-string, always call them with
    a string literal (not f-string) as first argument.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: logging.$METHOD($ARG, ...)
    - pattern: logger.$METHOD($ARG, ...)
    - pattern: log.$METHOD($ARG, ...)
    - pattern: $OBJ.debug($ARG, ...)
    - pattern: $OBJ.info($ARG, ...)
    - pattern: $OBJ.warning($ARG, ...)
    - pattern: $OBJ.error($ARG, ...)
    - pattern: $OBJ.critical($ARG, ...)
    - pattern: $OBJ.exception($ARG, ...)
    - pattern: $OBJ.log($ARG, ...)
  - metavariable-regex:
      metavariable: $ARG
      regex: ^(?!["\']).*$
  - pattern-not: logging.$METHOD("...", ...)
  - pattern-not: logger.$METHOD("...", ...)
  - pattern-not: log.$METHOD("...", ...)
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom pattern to detect non-literal first arguments
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to identify logging functions and string
          literal constraints
    original_description: For logging functions that expect a pattern-string, always
      call them with a string literal (not f-string) as first argument.