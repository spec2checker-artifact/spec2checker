rules:
- id: java-camel-case-split-conventional
  message: If a word already has conventional camel-case appearance (e.g., 'AdWords'),
    split into constituent parts ('ad words'). Does not apply to 'iOS'.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: $TYPE $VAR = ...
  - metavariable-regex:
      metavariable: $VAR
      regex: ^(?!iOS$)[a-z][a-z0-9]*(?:AdWords|WebSocket|XmlParser|HtmlParser|HttpRequest|HttpResponse|JsonParser|SqlQuery|IpAddress|HostName|UserName|FileName|ClassName|MethodName|PropertyName|FieldName|TypeName|ModuleName|PackageName|ParamName|ErrorCode|StatusCode|MessageQueue|TaskScheduler|ThreadPool|EventBus|DataStore|CacheManager|LogHandler|AuthProvider|CertValidator|TokenParser|KeySpec)[a-z0-9]*$
  - pattern-not: 'final $TYPE $VAR = ...'
  - pattern-not: 'private $TYPE $VAR = ...'
  - pattern-not: 'public $TYPE $VAR = ...'
  - pattern-not: 'protected $TYPE $VAR = ...'
  - pattern-not: 'static $TYPE $VAR = ...'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex-based detection only; may have false positives/negatives
          on complex identifiers
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule implementation for specific camel-case splitting
          logic
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to implement the specific splitting convention
          and 'iOS' exception
    original_description: If a word already has conventional camel-case appearance
      (e.g., 'AdWords'), split into constituent parts ('ad words'). Does not apply
      to 'iOS'.