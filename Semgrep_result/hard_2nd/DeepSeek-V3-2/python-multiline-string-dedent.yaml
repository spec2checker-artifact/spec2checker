rules:
- id: python-multiline-string-dedent
  message: Detect multi-line string literals that could benefit from using `textwrap.dedent`
    to remove leading spaces.
  languages:
  - python
  severity: WARNING
  pattern: "$STRING = \"\"\"\n    ...\n    \"\"\""
  metadata:
    syntax_$STRING: is_multiline_string_literal
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern matches multi-line strings but cannot reliably determine
          if dedent is needed based on surrounding indentation context.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to analyze string literal indentation relative
          to its context.
    original_description: Detect multi-line string literals that could benefit from
      using `textwrap.dedent` to remove leading spaces.
