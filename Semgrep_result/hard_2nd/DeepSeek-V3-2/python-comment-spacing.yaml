rules:
- id: python-comment-spacing
  message: Block and inline comments should be used for tricky, non-obvious, interesting
    or important parts of code and should start at least 2 spaces from code.
  languages:
  - python
  severity: WARNING
  pattern: '$CODE # $COMMENT'
  metadata:
    syntax_$CODE: distance_to_comment_less_than(2)
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: distance check requires custom metavariable analysis
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for whitespace distance
    original_description: Block and inline comments should be used for tricky, non-obvious,
      interesting or important parts of code and should start at least 2 spaces from
      code.
