rules:
- id: javascript-vertical-whitespace-function
  message: Blank lines at start or end of function body are not allowed.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: "$RET $FUNC($ARGS) {\n    ...\n}"
  - metavariable-type:
      metavariable: $FUNC
      type: function
  metadata:
    syntax_function_body: last_statement_not_blank_line
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom metavariable analysis for body content
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires AST query for statement positions
    original_description: Blank lines at start or end of function body are not allowed.
