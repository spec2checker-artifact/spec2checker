rules:
- id: cpp-thread-local-constinit
  message: '[DISABLED] thread_local variables at class or namespace scope must be
    initialized with a compile-time constant and annotated with constinit.'
  languages:
  - cpp
  severity: ERROR
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: thread_local variables at class or namespace scope must
      be initialized with a compile-time constant and annotated with constinit.
