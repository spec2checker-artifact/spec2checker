rules:
- id: shell-single-string-args
  message: Avoid passing multiple command arguments as a single string to eval, sh
    -c, or bash -c; leads to quoting nightmares. Error messages (echo/fail/printf)
    are exempt.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: eval "$...{$...}..."
    - pattern: eval $...
    - pattern: sh -c "$..."
    - pattern: bash -c "$..."
  - pattern-not-regex: '^\s*(fail|echo|printf|assert_build)\s'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Using a single string for multiple command arguments should
      be avoided; leads to eval or quoting nightmares.