rules:
- id: java-break-before-non-assignment-operator
  message: When a line is broken at a non-assignment operator, the line break must
    occur before the operator.
  languages:
  - java
  severity: WARNING
  pattern: $EXPR1 $OP $EXPR2
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom rule for line break detection; pattern only matches
          syntax, not formatting.
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD supports formatting rules via custom rulesets, but not natively
          for this specific operator break style.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL is not designed for formatting/style rule detection.
    original_description: When a line is broken at a non-assignment operator, the
      line break must occur before the operator.
