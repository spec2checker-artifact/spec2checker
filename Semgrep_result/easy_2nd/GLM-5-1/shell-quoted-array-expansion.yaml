rules:
- id: shell-quoted-array-expansion
  message: Use quoted expansion "${array[@]}" to access arrays.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $ARRAY[$INDEX]
  - metavariable-type:
      metavariable: $ARRAY
      type: expr
  - metavariable-type:
      metavariable: $INDEX
      type: expr
  metadata:
    syntax_$ARRAY: is_array_reference
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match unquoted array element access
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Use quoted expansion "${array[@]}" to access arrays.
