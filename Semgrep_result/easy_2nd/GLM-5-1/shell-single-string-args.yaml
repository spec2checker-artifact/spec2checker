rules:
- id: shell-single-string-args
  message: Using a single string for multiple command arguments should be avoided;
    leads to eval or quoting nightmares. Only applies to actual command invocations,
    not message strings in fail/echo/log calls.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $CMD $FLAGS
  - metavariable-regex:
      metavariable: $FLAGS
      regex: ^['"].*--.*['"]$
  - pattern-not: fail $FLAGS
  - pattern-not: echo $FLAGS
  - pattern-not: log $FLAGS
  - pattern-not: printf $FLAGS
  - pattern-not: warning $FLAGS
  - pattern-not: error $FLAGS
  - pattern-not: print $FLAGS
  metadata:
    syntax_$FLAGS: is_string_literal
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex-based detection may have false positives/negatives on complex
          string contents
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Using a single string for multiple command arguments should
      be avoided; leads to eval or quoting nightmares.