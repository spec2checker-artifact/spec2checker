rules:
- id: python-comprehension-simple-only
  message: Comprehensions with multiple 'for' clauses or multiple 'if' filters are
    not permitted. Only simple comprehensions with a single 'for' and at most one 'if'
    are allowed.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: |
        [$EXPR for $VAR1 in $ITER1 for $VAR2 in $ITER2]
    - pattern: |
        [$EXPR for $VAR1 in $ITER1 if $COND1 if $COND2]
    - pattern: |
        {$KEY: $VAL for $VAR1 in $ITER1 for $VAR2 in $ITER2}
    - pattern: |
        {$KEY: $VAL for $VAR1 in $ITER1 if $COND1 if $COND2}
    - pattern: |
        {$KEY: $VAL for $VAR1 in $ITER1 for $VAR2 in $ITER2 ...}
  metadata:
    syntax_comprehension: has_at_most_one_if_filter
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern may need extension for set/dict comprehensions and may
          not capture all syntactic variations of multiple clauses.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to count comprehension clauses.
    original_description: Comprehensions are allowed only for a single 'for' clause
      and a single optional 'if' filter. Multiple 'for' clauses or multiple filter
      expressions are not permitted.