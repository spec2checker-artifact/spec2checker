rules:
- id: cpp-avoid-macros-in-headers
  message: Avoid defining macros, especially in header files. Prefer inline functions,
    enums, and const/constexpr variables.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: '#define $MACRO ...'
  - metavariable-type:
      metavariable: $MACRO
      type: expr
  metadata:
    syntax_file: file_extension_matches('(.h|.hpp|.hh|.hxx)$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
        limitations: 'Can detect macro definitions but cannot enforce project-specific
          prefix or #undef after use.'
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
        limitations: Can detect macro definitions and file extensions.
    original_description: Avoid defining macros, especially in header files. Prefer
      inline functions, enums, and const/constexpr variables.
