rules:
- id: python-limit-classmethod
  message: Use `classmethod` only for named constructors or class-specific routines
    that modify global state. Named constructors (from_*, construct_from, _create),
    validators (validate_*), and state-modifying methods (set_*) are exempt.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: "@classmethod\ndef $FUNC(...):\n    ..."
  - pattern-not: "@classmethod\ndef setUpClass(...):\n    ..."
  - pattern-not: "@classmethod\ndef setUp(...):\n    ..."
  - pattern-not: "@classmethod\ndef tearDownClass(...):\n    ..."
  - pattern-not: "@classmethod\ndef tearDown(...):\n    ..."
  - pattern-not: "@classmethod\ndef _get_tempdir_path_cls(...):\n    ..."
  - pattern-not: "@classmethod\ndef _create(...):\n    ..."
  - pattern-not: "@classmethod\ndef from_config(...):\n    ..."
  - pattern-not: "@classmethod\ndef from_json(...):\n    ..."
  - pattern-not: "@classmethod\ndef construct_from(...):\n    ..."
  - pattern-not: "@classmethod\ndef set_default_xml_stream(...):\n    ..."
  - pattern-not: "@classmethod\ndef set_testsuites_property(...):\n    ..."
  - pattern-not: "@classmethod\ndef replacement_setupclass(...):\n    ..."
  - metavariable-pattern:
      metavariable: $FUNC
      pattern-not-regexp: ^(validate_|from_|set_|_create|construct_from)
  metadata:
    syntax_function: name_not_matches('from_.*')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: cannot semantically verify if method is a named constructor or
          modifies global state
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check method purpose
    original_description: Use `classmethod` only when writing a named constructor
      or class-specific routine that modifies global state.