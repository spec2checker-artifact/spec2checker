rules:
- id: python-future-import-encouraged
  message: `from __future__ import` statements must appear at the top of the module,
    not inside functions or class bodies. Placing them elsewhere is a violation.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: from __future__ import $ITEM
  - pattern-inside: |
      def $FUNC(...):
          ...
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Use of `from __future__ import` statements is encouraged
      to use modern Python features.