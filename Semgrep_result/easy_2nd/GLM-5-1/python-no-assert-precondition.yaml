rules:
- id: python-no-assert-precondition
  message: Do not use `assert` statements in place of conditionals or validating preconditions;
    they are not guaranteed to be evaluated. For pytest tests, `assert` is okay. This
    rule excludes test files (files matching *_test.py, test_*.py, or containing
    pytest imports).
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: assert $COND, ...
  - pattern-not-inside: |
      def test_$NAME(...):
          ...
  - pattern-not-inside: |
      class Test$NAME(...):
          ...
  metadata:
    syntax_file: not_contains_pattern('from pytest import')
    syntax_function: not_name_matches_regex('^test_')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
        limitations: Context constraints for excluding pytest test files/functions
          may have false positives/negatives.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to exclude pytest test contexts.
    original_description: Do not use `assert` statements in place of conditionals
      or validating preconditions; they are not guaranteed to be evaluated. For pytest
      tests, `assert` is okay.