rules:
- id: javascript-grouping-parentheses-recommended
  message: Omit optional grouping parentheses only when author and reviewer agree
    no reasonable chance of misinterpretation. Do not assume reader knows precedence.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $EXPR
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_$EXPR: has_parentheses
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom logic to detect ambiguous precedence and lack
          of parentheses
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect ambiguous precedence scenarios
    original_description: Omit optional grouping parentheses only when author and
      reviewer agree no reasonable chance of misinterpretation. Do not assume reader
      knows precedence.
