rules:
- id: java-assignment-break-after-symbol
  message: Detect when an assignment operator or colon in an enhanced for loop is
    broken across lines, typically expecting the break after the symbol.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: "$TYPE $VAR $OP\n    $EXPR;"
  - metavariable-regex:
      metavariable: $OP
      regex: '=|:'
  metadata:
    syntax_statement: is_assignment_or_for_each
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern may match other statements with similar line breaks.
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom rule for line break detection.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires AST query for line positions.
    original_description: Detect when an assignment operator or colon in an enhanced
      for loop is broken across lines, typically expecting the break after the symbol.
