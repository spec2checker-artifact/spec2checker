rules:
- id: shell-control-flow-same-line
  message: Put `; then` and `; do` on the same line as `if`, `for`, `while`. The `else`
    keyword should be on its own line.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: "if [[ $COND ]];\nthen\n    ...\nfi\n\nfor $VAR in $LIST;\ndo\n    ...\n\
      done\n\nwhile [[ $COND ]];\ndo\n    ...\ndone"
  - metavariable-type:
      metavariable: $COND
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $LIST
      type: expr
  metadata:
    syntax_keyword: keyword_on_newline
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching for newline after semicolon
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Put `; then` and `; do` on the same line as `if`, `for`,
      `while`. The `else` keyword should be on its own line.
