rules:
- id: python-no-assert-precondition
  message: Do not use `assert` statements in place of conditionals or validating
    preconditions; they are not guaranteed to be evaluated. For pytest tests, `assert`
    is okay.
  languages:
  - python
  severity: WARNING
  paths:
    exclude:
    - "*test_modal_sandbox*"
    - "*absltest*"
    - "*parameterized*"
  patterns:
  - pattern-regex: "assert\\s+.+"
  - pattern-not-regex: "self\\.assert\\w+\\("
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
        limitations: paths exclusion filters out known test framework files; pattern-not-regex
          excludes self.assert* test helper methods.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to exclude pytest test contexts.
    original_description: Do not use `assert` statements in place of conditionals
      or validating preconditions; they are not guaranteed to be evaluated. For pytest
      tests, `assert` is okay.
