rules:
- id: java-test-class-naming
  message: Test class name must end with 'Test'. If it covers a single class, the
    name should be that class name plus 'Test'.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern-inside: |
      @RunWith(...)
      class $CLASS { ... }
  - metavariable-regex:
      metavariable: $CLASS
      regex: ^(?!.*Test$)[A-Z][a-zA-Z0-9]*$
  - pattern-not-inside: |
      private ... class $CLASS { ... }
  - pattern-not-inside: |
      protected ... class $CLASS { ... }
  - pattern-not-inside: |
      static class $CLASS { ... }
  - pattern-not-inside: |
      enum $CLASS { ... }
  metadata:
    syntax_$CLASS: name_ends_with('Test')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule to check naming pattern
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: can match pattern but cannot enforce 'covers a single class'
          semantic rule
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check naming pattern
    original_description: Test class name must end with 'Test'. If it covers a single
      class, the name should be that class name plus 'Test'.