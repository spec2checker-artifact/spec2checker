rules:
- id: python-import-style
  message: Enforce use of 'from x import y' syntax where x is the package prefix and
    y is the module name with no prefix. Relative names are prohibited; full package
    name must be used.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: import $X.$Y
  - pattern-not: from collections import abc
  - pattern-not: from typing import ...
  - pattern-not: from __future__ import ...
  metadata:
    syntax_import: import_statement_has_dot
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cannot enforce that the matched import is the *only* valid form;
          may flag imports that are not intended to be rewritten.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to check for the specific import pattern
          and suggest the 'from ... import' alternative.
    original_description: Enforce use of 'from x import y' syntax where x is the package
      prefix and y is the module name with no prefix. Relative names are prohibited;
      full package name must be used.