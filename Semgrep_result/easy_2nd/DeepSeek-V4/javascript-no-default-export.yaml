rules:
- id: javascript-no-default-export
  message: Use named exports in all code. Do not use default exports.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: export default $EXPR
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript/ES module analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Use named exports in all code. Do not use default exports.
