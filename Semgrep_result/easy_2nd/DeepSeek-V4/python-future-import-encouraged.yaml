rules:
- id: python-future-import-encouraged
  message: Use of `from __future__ import` statements is encouraged to use modern
    Python features.
  languages:
  - python
  severity: WARNING
  pattern-regex: '__DISABLED_ITER1__'
  metadata:
    disabled: true
    reason: 'Rule logic fundamentally inverted: flags existing future imports (good practice) instead of detecting missing ones. Semgrep cannot detect "missing" imports without cross-file analysis. All 3 findings were FP per evaluate1. Disabled in iteration1.'
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Use of `from __future__ import` statements is encouraged
      to use modern Python features.