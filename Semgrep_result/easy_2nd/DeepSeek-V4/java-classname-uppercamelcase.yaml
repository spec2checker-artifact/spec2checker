rules:
- id: java-classname-uppercamelcase
  message: '[DISABLED] Class names must be written in UpperCamelCase, typically nouns
    or noun phrases. Interface names may be nouns or adjectives.'
  languages:
  - java
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Class names must be written in UpperCamelCase, typically
      nouns or noun phrases. Interface names may be nouns or adjectives.
