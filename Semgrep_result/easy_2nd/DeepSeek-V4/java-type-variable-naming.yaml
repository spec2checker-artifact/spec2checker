rules:
- id: java-type-variable-naming
  message: Type variable names must be in UpperCamelCase followed by a capital T (e.g.,
    RequestT, FooBarT).
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: <$VAR extends $BOUND>
  - metavariable-regex:
      metavariable: $VAR
      regex: ^[A-Z][a-zA-Z0-9]*T$
  - metavariable-type:
      metavariable: $BOUND
      type: expr
  metadata:
    syntax_$VAR: is_type_variable
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex matching may not capture all edge cases
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Java analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for naming pattern
    original_description: Type variable names must be in UpperCamelCase followed by
      a capital T (e.g., RequestT, FooBarT).
