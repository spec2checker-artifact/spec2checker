rules:
- id: python-conditional-import-discouraged
  message: 'Conditional imports for non-type-checking purposes are discouraged; prefer refactoring. TYPE_CHECKING imports are acceptable.'
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: "if $COND:\n    from $PKG import $ITEM"
    - pattern: "if $COND:\n    import $PKG"
  - pattern-not: "if TYPE_CHECKING:\n    ..."
  - pattern-not: "if typing.TYPE_CHECKING:\n    ..."
  - pattern-not: "if $MODULE.TYPE_CHECKING:\n    ..."
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for discouragement policy
    original_description: Use conditional imports only in exceptional cases where
      imports needed for type checking must be avoided at runtime. Discouraged; prefer
      refactoring.