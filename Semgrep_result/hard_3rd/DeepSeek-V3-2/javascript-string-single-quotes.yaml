rules:
- id: javascript-string-single-quotes
  message: Ordinary string literals must be delimited with single quotes `'`, not
    double quotes `"`. May not span multiple lines. Use template strings to avoid
    escaping single quotes.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: '"$STRING"'
  - metavariable-type:
      metavariable: $STRING
      type: expr
  metadata:
    syntax_string: is_string_literal
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Ordinary string literals must be delimited with single quotes
      `'`, not double quotes `"`. May not span multiple lines. Use template strings
      to avoid escaping single quotes.
