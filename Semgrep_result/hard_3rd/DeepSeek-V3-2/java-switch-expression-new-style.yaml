rules:
- id: java-switch-expression-new-style
  message: Switch expressions must use new-style (arrow ->) syntax.
  languages:
  - java
  severity: ERROR
  patterns:
  - pattern: "switch ($EXPR) {\n    case $CASE: $BODY; break;\n}"
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  - metavariable-type:
      metavariable: $CASE
      type: expr
  - metavariable-type:
      metavariable: $BODY
      type: expr
  metadata:
    syntax_switch: is_expression
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires Java 14+ pattern matching
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for switch expression syntax
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires Java 14+ language support
    original_description: Switch expressions must use new-style (arrow ->) syntax.
