rules:
- id: cpp-avoid-failing-constructor
  message: Avoid initialization that can fail in constructors if you can't signal
    an error. Consider factory functions or `Init()` methods.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: "class $CLASS {\n    $CLASS(...) {\n        ...\n    }\n}"
  - metavariable-type:
      metavariable: $CLASS
      type: type
  metadata:
    syntax_constructor: contains_call('new', 'malloc', 'open', 'fopen', 'throw')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires manual pattern for specific failing calls
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires custom query to detect failing resource acquisition
    original_description: Avoid initialization that can fail in constructors if you
      can't signal an error. Consider factory functions or `Init()` methods.
