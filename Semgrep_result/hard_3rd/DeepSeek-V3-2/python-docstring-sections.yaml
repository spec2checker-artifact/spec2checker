rules:
- id: python-docstring-sections
  message: 'Public function with multi-line docstring must contain sections: Args, Returns (or Yields), and Raises with proper hanging indent. Short docstrings, private methods, and "See base class" references are exempt.'
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: "def $FUNC(...):\n    \"\"\"$DOC\"\"\"\n    ..."
  - pattern-not: "def $FUNC(...):\n    \"\"\"See base class.\"\"\"\n    ..."
  - pattern-not: "def $FUNC(...):\n    \"\"\"See $REF.\"\"\"\n    ..."
  - metavariable-regex:
      metavariable: $FUNC
      regex: "^[a-zA-Z]"
  - metavariable-regex:
      metavariable: $DOC
      regex: ".+\n.+"
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom regex for section detection and indentation validation
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for docstring structure
    original_description: 'Function docstring must contain sections: Args, Returns
      (or Yields), and Raises with proper hanging indent.'