rules:
- id: java-switch-exhaustiveness
  message: '[DISABLED] Every switch statement must be exhaustive, requiring a default
    case even if empty, unless all enum values are explicitly covered.'
  languages:
  - java
  severity: ERROR
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Every switch statement must be exhaustive, requiring a default
      case even if empty, unless all enum values are explicitly covered.
