rules:
- id: javascript-no-getter-setter
  message: Do not use JavaScript getter/setter properties. Provide ordinary methods
    instead. Exception for data binding frameworks or external APIs.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: get $PROP(...) { ... }
  - metavariable-type:
      metavariable: $PROP
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Do not use JavaScript getter/setter properties. Provide
      ordinary methods instead. Exception for data binding frameworks or external
      APIs.
