rules:
- id: java-empty-block-multi-statement
  message: Empty blocks are not allowed in multi-block statements like if/else or
    try/catch/finally.
  languages:
  - java
  severity: ERROR
  patterns:
  - pattern: "try {\n  ...\n} catch ($EXCEPTION $VAR) {}"
  - metavariable-type:
      metavariable: $EXCEPTION
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    syntax_block: is_empty
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern for each multi-block statement type (try/catch,
          if/else)
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD's EmptyCatchBlock rule exists but may need configuration
          for all multi-block contexts
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect empty blocks in multi-block statements
    original_description: Empty blocks are not allowed in multi-block statements like
      if/else or try/catch/finally.
