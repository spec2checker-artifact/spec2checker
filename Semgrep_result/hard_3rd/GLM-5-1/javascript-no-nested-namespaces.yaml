rules:
- id: javascript-no-nested-namespaces
  message: Do not define a nested type (class, typedef, enum, interface) on another
    module-local name. Use top-level exports.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $MODULE.$TYPE = $EXPR
  - metavariable-type:
      metavariable: $MODULE
      type: expr
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_$EXPR: is_type_definition
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: may match non-namespace assignments; requires manual review
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect nested namespace definitions
    original_description: Do not define a nested type (class, typedef, enum, interface)
      on another module-local name. Use top-level exports.
