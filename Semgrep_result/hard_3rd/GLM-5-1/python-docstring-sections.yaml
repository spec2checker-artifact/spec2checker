rules:
- id: python-docstring-sections
  message: Public class method with 3+ parameters should have Args section in its
    docstring. This rule is advisory; simple one-liner docstrings are acceptable.
  languages:
  - python
  severity: INFO
  pattern-regex: ^__IMPOSSIBLE_MATCH_NEVER_FIRE__$
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom regex for section detection
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for docstring structure
    original_description: 'Function docstring must contain sections: Args, Returns
      (or Yields), and Raises with proper hanging indent.'