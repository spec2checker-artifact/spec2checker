rules:
- id: shell-arithmetic-comparison-no-dollar
  message: Inside arithmetic comparison `(( ... ))`, variables should be referenced
    by name without the `$` prefix.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: if (( $${VAR} $OP $${VAR2} )); then
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $VAR2
      type: expr
  - metavariable-type:
      metavariable: $OP
      type: expr
  metadata:
    syntax_$VAR: matches_regex('^\$[a-zA-Z_][a-zA-Z0-9_]*$')
    syntax_$VAR2: matches_regex('^\$[a-zA-Z_][a-zA-Z0-9_]*$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires matching variable patterns with leading $
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Inside arithmetic comparison `(( ... ))`, variables should
      be referenced by name without the `$` prefix.
