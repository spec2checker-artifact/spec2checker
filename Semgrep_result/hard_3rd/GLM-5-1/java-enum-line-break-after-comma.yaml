rules:
- id: java-enum-line-break-after-comma
  message: After a comma following an enum constant, a line break is optional. Additional
    blank lines (usually one) are allowed.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: "enum $ENUM {\n    $CONST1,\n    $CONST2\n}"
  - metavariable-type:
      metavariable: $ENUM
      type: type
  - metavariable-type:
      metavariable: $CONST1
      type: expr
  - metavariable-type:
      metavariable: $CONST2
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern matches structure but cannot enforce optional line break
          style.
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom rule for formatting check.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL is not designed for formatting/style rules.
    original_description: After a comma following an enum constant, a line break is
      optional. Additional blank lines (usually one) are allowed.
