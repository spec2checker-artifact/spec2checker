rules:
- id: java-method-annotation-exception-single-parameterless
  message: A single parameterless annotation may appear together with the first line
    of the method signature.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: '@$ANNOTATION $MODIFIERS? $RETURN $METHOD($PARAMS) { ... }'
  - metavariable-type:
      metavariable: $ANNOTATION
      type: expr
  - metavariable-type:
      metavariable: $METHOD
      type: function
  metadata:
    syntax_method: parameter_count == 0
    syntax_annotation: annotation_count == 1
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise matching of modifiers and return type
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule to check annotation and signature line
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for annotation and signature line
    original_description: A single parameterless annotation may appear together with
      the first line of the method signature.
