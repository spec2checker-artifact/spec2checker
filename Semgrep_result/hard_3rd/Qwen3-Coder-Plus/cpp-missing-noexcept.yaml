rules:
- id: cpp-missing-noexcept
  message: Detect missing `noexcept` specifier on move constructors and move assignment
    operators where it is useful for performance and accurately reflects semantics.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $CLASS($CLASS&& $ARG) $SPECIFIER { ... }
  - metavariable-type:
      metavariable: $CLASS
      type: type
  - metavariable-type:
      metavariable: $ARG
      type: expr
  - metavariable-type:
      metavariable: $SPECIFIER
      type: expr
  metadata:
    syntax_function: is_move_constructor
    syntax_$SPECIFIER: not_contains('noexcept')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: May require additional patterns for move assignment operators
          and complex specifier combinations.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: Requires type resolution to accurately identify move constructors/operators
          and their exception safety guarantees.
    original_description: Detect missing `noexcept` specifier on move constructors
      and move assignment operators where it is useful for performance and accurately
      reflects semantics.
