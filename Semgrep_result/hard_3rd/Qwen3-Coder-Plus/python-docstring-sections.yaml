rules:
- id: python-docstring-sections
  message: 'For functions with 3+ parameters, docstring should contain sections:
    Args, Returns (or Yields), and Raises with proper hanging indent. Simple single-line
    docstrings are acceptable for simple functions.'
  languages:
  - python
  severity: INFO
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: per evaluate2.txt, 0% precision (84 FP, 0 TP) - rule is too strict, flags all simple docstrings as violations
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom regex for section detection and indentation validation
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for docstring structure
    original_description: 'Function docstring must contain sections: Args, Returns
      (or Yields), and Raises with proper hanging indent.'