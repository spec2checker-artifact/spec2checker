rules:
- id: javascript-prefer-template-literals
  message: Use template literals `` `...` `` over complex string concatenation, especially
    with multiple literals. May span multiple lines.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $A + $B
  - metavariable-type:
      metavariable: $A
      type: expr
  - metavariable-type:
      metavariable: $B
      type: expr
  metadata:
    syntax_$A: is_string_literal
    syntax_$B: is_string_literal
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match simple concatenations that are not complex
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect complex concatenation patterns
    original_description: Use template literals `` `...` `` over complex string concatenation,
      especially with multiple literals. May span multiple lines.
