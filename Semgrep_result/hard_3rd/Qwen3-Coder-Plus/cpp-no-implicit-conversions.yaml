rules:
- id: cpp-no-implicit-conversions
  message: Do not define implicit conversions. Use the `explicit` keyword. Exceptions
    for types designed to be interchangeable require a waiver.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: operator $TYPE() $CV_QUALIFIER { ... }
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $CV_QUALIFIER
      type: expr
  metadata:
    syntax_function: missing_keyword('explicit')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: May not detect all forms of conversion operators or complex cv-qualifiers.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: Requires type resolution to fully verify conversion operators.
    original_description: Do not define implicit conversions. Use the `explicit` keyword.
      Exceptions for types designed to be interchangeable require a waiver.
