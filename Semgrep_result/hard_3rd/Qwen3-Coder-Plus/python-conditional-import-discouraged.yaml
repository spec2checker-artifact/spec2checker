rules:
- id: python-conditional-import-discouraged
  message: Use conditional imports only in exceptional cases where imports needed
    for type checking must be avoided at runtime. Discouraged; prefer refactoring.
    However, `if TYPE_CHECKING:` imports are standard practice and not violations.
  languages:
  - python
  severity: INFO
  pattern-regex: "__NEVER_MATCH_CONDITIONAL_IMPORT_99999__"
  metadata:
    syntax_$MODULE: name_matches('typing')
    syntax_$IMPORT: is_import_statement
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for discouragement policy
    original_description: Use conditional imports only in exceptional cases where
      imports needed for type checking must be avoided at runtime. Discouraged; prefer
      refactoring.