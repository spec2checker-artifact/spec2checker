rules:
- id: cpp-comment-class-data-members
  message: '[DISABLED] Class data members must have a comment explaining their purpose
    and invariants not expressed by type and name.'
  languages:
  - cpp
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Class data members must have a comment explaining their
      purpose and invariants not expressed by type and name.
