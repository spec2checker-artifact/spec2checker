rules:
- id: shell-prefer-builtin-over-process
  message: Given the choice between invoking a shell builtin and a separate process,
    choose the builtin for efficiency, robustness, and portability.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: echo $VAR | sed $PATTERN
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $PATTERN
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match other uses of echo and sed; requires manual
          review for false positives
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Given the choice between invoking a shell builtin and a
      separate process, choose the builtin for efficiency, robustness, and portability.
