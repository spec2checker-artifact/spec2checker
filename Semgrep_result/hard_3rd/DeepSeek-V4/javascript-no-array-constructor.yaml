rules:
- id: javascript-no-array-constructor
  message: Do not use variadic Array constructor; error-prone. Use literal instead.
    Explicit allocation `new Array(length)` is allowed.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: new Array($ARGS)
  - metavariable-type:
      metavariable: $ARGS
      type: expr
  metadata:
    syntax_$ARGS: not_single_numeric_literal
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
        limitations: requires pattern to exclude single numeric argument
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to distinguish single numeric argument
    original_description: Do not use variadic Array constructor; error-prone. Use
      literal instead. Explicit allocation `new Array(length)` is allowed.
