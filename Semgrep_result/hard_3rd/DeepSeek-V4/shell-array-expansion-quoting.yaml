rules:
- id: shell-array-expansion-quoting
  message: Use "${array[@]}" expansion to preserve individual elements and quoting.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $CMD $ARRAY
  - metavariable-type:
      metavariable: $CMD
      type: expr
  - metavariable-type:
      metavariable: $ARRAY
      type: expr
  metadata:
    syntax_$ARRAY: not name_matches_regex('^\$\{[A-Za-z_][A-Za-z0-9_]*\[@\]\}$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires shell pattern matching; may have false positives with
          complex variable expansions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Use "${array[@]}" expansion to preserve individual elements
      and quoting.
