rules:
- id: javascript-destructuring-parameter-simple
  message: Object destructuring patterns allowed. For function parameters, keep to
    single level of unquoted shorthand properties; no nested or computed. Default
    to `{}`.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: function $FUNC($ARGS, { $PROPS } = {}) { ... }
  - metavariable-type:
      metavariable: $FUNC
      type: function
  - metavariable-type:
      metavariable: $ARGS
      type: expr
  - metavariable-type:
      metavariable: $PROPS
      type: expr
  metadata:
    syntax_$PROPS: is_simple_destructuring_pattern
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom pattern to enforce 'simple' destructuring constraint
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check destructuring pattern complexity
    original_description: Object destructuring patterns allowed. For function parameters,
      keep to single level of unquoted shorthand properties; no nested or computed.
      Default to `{}`.
