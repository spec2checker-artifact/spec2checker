rules:
- id: javascript-object-literal-trailing-comma
  message: Include a trailing comma after the final property in an object literal
    when there is a line break between the property and the closing brace.
  languages:
  - javascript
  severity: WARNING
  pattern: "const $VAR = {\n  ...\n  $PROP: $VAL\n}"
  metadata:
    syntax_object_literal: last_property_no_trailing_comma
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match the specific missing comma scenario
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for formatting rule
    original_description: Include a trailing comma after the final property in an
      object literal when there is a line break between the property and the closing
      brace.
