rules:
- id: cpp-copyable-movable-clear
  message: A class's public API must make clear whether it is copyable, move-only,
    or neither by explicitly declaring or deleting copy/move constructors and assignment
    operators.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: class $CLASS { ... };
  - metavariable-regex:
      metavariable: $CLASS
      regex: ^[A-Za-z_][A-Za-z0-9_]*$
  metadata:
    syntax_$CLASS: missing_public_move_assignment
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires complex pattern matching for all special member functions
          and their access specifiers
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires custom query to check for missing explicit declarations
    original_description: A class's public API must make clear whether it is copyable,
      move-only, or neither by explicitly declaring or deleting copy/move constructors
      and assignment operators.
