rules:
- id: java-non-ascii-unicode-escape
  message: Non-ASCII characters should use the actual Unicode character or equivalent
    Unicode escape for readability. Unicode escapes outside string literals and comments
    are strongly discouraged.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: \\u$HEX{4}
  - metavariable-regex:
      metavariable: $HEX
      regex: '[0-9a-fA-F]{4}'
  metadata:
    syntax_expression: not_inside_comment
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match Unicode escapes outside strings/comments;
          may have false positives in complex nested structures
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule to detect Unicode escapes outside string
          literals and comments
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires query to locate Unicode escape sequences and check their
          syntactic context
    original_description: Non-ASCII characters should use the actual Unicode character
      or equivalent Unicode escape for readability. Unicode escapes outside string
      literals and comments are strongly discouraged.
