rules:
- id: cpp-static-internal-linkage
  message: Detect use of 'static' for internal linkage in .cc files. Prefer unnamed
    namespaces.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: static $TYPE $NAME(...);
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $NAME
      type: expr
  metadata:
    syntax_file: file_extension_matches('cc|cpp|cxx|c++|C')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: cannot enforce preference for unnamed namespace
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect .cc files and static linkage
    original_description: Detect use of 'static' for internal linkage in .cc files.
      Prefer unnamed namespaces.
