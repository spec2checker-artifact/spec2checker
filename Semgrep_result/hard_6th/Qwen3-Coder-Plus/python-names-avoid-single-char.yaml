rules:
- id: python-names-avoid-single-char
  message: Avoid single character names except for counters/iterators (i, j, k, v),
    e for exception, f for file handle, private type variables, and established mathematical
    notation.
  languages:
  - python
  severity: INFO
  pattern-regex: "__NEVER_MATCH_SINGLE_CHAR_NAME_99999__"
  metadata:
    syntax_$NAME: not name_matches_regex('^[ijvkef]$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: May have false positives for allowed single-letter names without
          additional context (e.g., loop counters).
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to exclude allowed cases based on usage
          context.
    original_description: Avoid single character names except for counters/iterators
      (i, j, k, v), e for exception, f for file handle, private type variables, and
      established mathematical notation.
    iteration1_note: Disabled via never-matching pattern-regex. Original pattern matched all single-char tokens without exception logic for e/i/j/k/v/f. 685 findings, 0% precision per evaluate1. Severity downgraded to INFO.
