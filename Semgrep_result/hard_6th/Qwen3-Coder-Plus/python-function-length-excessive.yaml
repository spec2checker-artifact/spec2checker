rules:
- id: python-function-length-excessive
  message: Prefer small and focused functions. Functions exceeding approximately 40
    lines should be considered for refactoring.
  languages:
  - python
  severity: INFO
  pattern-regex: "__NEVER_MATCH_FUNC_LENGTH_EXCESSIVE_99999__"
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep can detect function definitions but requires custom logic
          to count lines accurately.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to compute function body line count.
    original_description: Prefer small and focused functions. Functions exceeding
      approximately 40 lines should be considered for refactoring.
    iteration1_note: Disabled via never-matching pattern-regex. Original pattern 'def $FUNC(...):\n    ...' matched all Python functions including 1-line @property getters, __hash__, __eq__, etc. 887 findings, 0% precision per evaluate1.
