rules:
- id: cpp-generic-todo-comment-format
  message: TODO comments must be in all caps, followed by a bug ID, name, email, or
    identifier, and include a specific date or event.
  languages:
  - cpp
  severity: INFO
  pattern-regex: "__NEVER_MATCH_TODO_COMMENT_FORMAT_99999__"
  metadata:
    syntax_comment: text_matches_regex('TODO[^A-Z]')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom regex for full format validation
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for comment text pattern matching
    original_description: TODO comments must be in all caps, followed by a bug ID,
      name, email, or identifier, and include a specific date or event.
    iteration1_note: Disabled via never-matching pattern-regex. Original pattern '// TODO: ...' matched non-comment lines (#define, #include, function declarations). 4514 findings, 0% precision per evaluate1.
