rules:
- id: python-avoid-todo-individual-context
  message: Avoid adding TODO comments that refer to an individual or team as the context.
    Use an issue tracker instead.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: '# TODO: $PREFIX$USER$SUFFIX'
  - metavariable-regex:
      metavariable: $USER
      regex: '@?[a-zA-Z0-9_-]+'
  metadata:
    syntax_comment: matches_regex('TODO.*@')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex matching on comments may have false positives
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for comment pattern matching
    original_description: Avoid adding TODO comments that refer to an individual or
      team as the context. Use an issue tracker instead.
