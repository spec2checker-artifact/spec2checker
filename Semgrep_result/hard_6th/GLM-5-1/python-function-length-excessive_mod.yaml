rules:
- id: python-function-length-excessive-disabled
  message: DISABLED - This rule was disabled because the line counting logic was severely broken, flagging functions of 1-10 lines as exceeding 40 lines.
  languages:
  - python
  severity: INFO
  pattern-either:
  - pattern: "DISABLED_RULE_NO_MATCH_XYZ_12345"
  metadata:
    disabled: true
    reason: The function body line counting logic was completely wrong. Semgrep pattern-based matching cannot accurately count function body lines. This rule is disabled to prevent massive false positives.
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep can detect function definitions but requires custom logic
          to count lines accurately.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to compute function body line count.
    original_description: Prefer small and focused functions. Functions exceeding
      approximately 40 lines should be considered for refactoring.