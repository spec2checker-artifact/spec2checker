rules:
- id: shell-arithmetic-comparison-no-dollar
  message: Inside arithmetic evaluation `(( ... ))`, special variables like `$#`, `$?`, `$$`, `$!` should not use the `$` prefix. Use `#`, `?`, etc. instead.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: (( $# ... ))
  - pattern-not: (( ${#...} ... ))
  metadata:
    syntax_expr: contains_dollar_in_arithmetic
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match variable names prefixed with $ inside
          (( ))
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Inside arithmetic evaluation `(( ... ))`, variables should
      be referenced by name without the `$` prefix.