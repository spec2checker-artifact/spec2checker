rules:
- id: java-todo-comment-format
  message: TODO comments must begin with TODO in all caps, followed by a colon, a
    link to a resource (preferably a bug reference), a hyphen, and an explanatory
    string.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: '// TODO: $LINK - $DESC'
  - metavariable-type:
      metavariable: $LINK
      type: expr
  - metavariable-type:
      metavariable: $DESC
      type: expr
  metadata:
    syntax_$LINK: matches_regex('^[a-zA-Z0-9./-]+$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex validation on metavariables may be limited
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not have a built-in rule for TODO comment format; requires
          custom rule
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for comment format
    original_description: TODO comments must begin with TODO in all caps, followed
      by a colon, a link to a resource (preferably a bug reference), a hyphen, and
      an explanatory string.
