rules:
- id: shell-loop-variable-naming
  message: Loop variable names should be similarly named for the collection being
    iterated over.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: "for $VAR in $ITERABLE; do\n    ...\ndone"
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $ITERABLE
      type: expr
  metadata:
    syntax_$VAR: name_matches_regex('^[a-z][a-z0-9_]*$')
    syntax_$ITERABLE: name_matches_regex('^[a-z][a-z0-9_]*$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom logic to check semantic similarity between variable
          and iterable names
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Loop variable names should be similarly named for the collection
      being iterated over.
