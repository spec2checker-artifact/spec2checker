rules:
- id: cpp-generic-todo-comment-format-disabled
  message: DISABLED - This rule was disabled because TODO comments without parenthesized annotation are acceptable practice, not violations.
  languages:
  - cpp
  severity: INFO
  pattern-either:
  - pattern: "DISABLED_RULE_NO_MATCH_XYZ_12345"
  metadata:
    disabled: true
    reason: The rule flagged TODO comments without parenthesized annotation (like TODO(username)) as violations, but this is acceptable practice. Only 1 finding was a false positive.
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom regex for full format validation
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for comment text pattern matching
    original_description: TODO comments must be in all caps, followed by a bug ID,
      name, email, or identifier, and include a specific date or event.