rules:
- id: shell-avoid-dash-filename
  message: Using `./*` prevents filenames beginning with `-` being interpreted as
    options.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $CMD $ARGS
  - metavariable-type:
      metavariable: $CMD
      type: expr
  - metavariable-type:
      metavariable: $ARGS
      type: expr
  metadata:
    syntax_$ARGS: matches_pattern('^[^-].*')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching on command arguments
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Using `./*` prevents filenames beginning with `-` being
      interpreted as options.
