rules:
- id: javascript-one-var-per-declaration
  message: Every local variable declaration declares only one variable; no `let a
    = 1, b = 2;`.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: let $VAR1 = $EXPR1, $VAR2 = $EXPR2;
  - metavariable-type:
      metavariable: $VAR1
      type: expr
  - metavariable-type:
      metavariable: $EXPR1
      type: expr
  - metavariable-type:
      metavariable: $VAR2
      type: expr
  - metavariable-type:
      metavariable: $EXPR2
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Every local variable declaration declares only one variable;
      no `let a = 1, b = 2;`.
