rules:
- id: shell-function-keyword-consistency
  message: The `function` keyword is optional, but must be used consistently throughout
    a project.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: function $FUNC(...) { ... }
  - metavariable-type:
      metavariable: $FUNC
      type: function
  metadata:
    capabilities_required:
      cross_file: true
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cross-file consistency detection requires project-wide analysis
          which is not natively supported.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to compare all function declarations across
          the project.
    original_description: The `function` keyword is optional, but must be used consistently
      throughout a project.
