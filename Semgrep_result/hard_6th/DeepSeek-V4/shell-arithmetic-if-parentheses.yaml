rules:
- id: shell-arithmetic-if-parentheses
  message: Use `(( ... ))` for arithmetic in `if` statements.
  languages:
  - bash
  severity: ERROR
  patterns:
  - pattern: if $EXPR; then
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_$EXPR: not_matches_pattern('^\(\(')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching for shell arithmetic expressions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Use `(( ... ))` for arithmetic in `if` statements.
