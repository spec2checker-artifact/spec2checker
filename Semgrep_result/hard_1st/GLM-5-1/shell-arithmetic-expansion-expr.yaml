rules:
- id: shell-arithmetic-expansion-expr
  message: Always use `$(( ... ))` for arithmetic expansion instead of backticks with
    `expr`.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: '`expr $EXPR`'
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match non-arithmetic uses of expr
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Always use `$(( ... ))` for arithmetic expansion instead
      of backticks with `expr`.
