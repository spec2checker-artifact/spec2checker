rules:
- id: cpp-no-implicit-conversion
  message: Do not define implicit conversions. Use the `explicit` keyword for conversion
    operators and single-argument constructors.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: "operator $TYPE() $CV_QUALIFIERS {\n    ...\n}"
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $CV_QUALIFIERS
      type: expr
  metadata:
    syntax_function: missing_keyword('explicit')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: May not detect all single-argument constructors; waiver logic
          not supported.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: Requires type resolution for comprehensive detection of all implicit
          conversions.
    original_description: Do not define implicit conversions. Use the `explicit` keyword
      for conversion operators and single-argument constructors.
