rules:
- id: shell-avoid-colon-in-function-name
  message: Functions intended for interactive use may choose to avoid colons as it
    can confuse bash auto-completion.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: "function $FUNC(...) {\n    ...\n}"
  - metavariable-regex:
      metavariable: $FUNC
      regex: .*::.*
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep's shell pattern matching may have limited support for
          complex function name regex validation.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis.
    original_description: Functions intended for interactive use may choose to avoid
      colons as it can confuse bash auto-completion.
