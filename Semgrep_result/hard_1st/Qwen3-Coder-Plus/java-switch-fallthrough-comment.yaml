rules:
- id: java-switch-fallthrough-comment
  message: Each statement group in a switch case must either terminate abruptly (break/continue/return/throw)
    or be marked with a fall-through comment (e.g., // fall through).
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: "case $CASE:\n    $BODY"
  - metavariable-type:
      metavariable: $CASE
      type: expr
  - metavariable-type:
      metavariable: $BODY
      type: expr
  metadata:
    syntax_$BODY: not_contains_fallthrough_comment
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom logic to detect abrupt termination and specific
          comment patterns
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD's existing rule may need configuration for comment format
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check for comment presence
    original_description: Each statement group in a switch case must either terminate
      abruptly (break/continue/return/throw) or be marked with a fall-through comment
      (e.g., // fall through).
