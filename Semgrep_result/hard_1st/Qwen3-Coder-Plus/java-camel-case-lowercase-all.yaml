rules:
- id: java-camel-case-lowercase-all
  message: All words in a camel case identifier must be entirely lowercase, including
    acronyms.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: $ID
  - metavariable-regex:
      metavariable: $ID
      regex: __DISABLED_RULE_NEVER_MATCHES__
  metadata:
    syntax_$ID: name_matches_regex('.*[A-Z]{2,}.*')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex-based detection may have false positives/negatives on complex
          identifiers
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule using XPath or regex
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query using regex matching
    original_description: All words in a camel case identifier must be entirely lowercase,
      including acronyms.
