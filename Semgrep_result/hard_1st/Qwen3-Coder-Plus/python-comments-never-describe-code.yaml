rules:
- id: python-comments-never-describe-code
  message: Detect comments that merely describe the code, assuming the reader knows
    Python.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: '# $COMMENT'
  - metavariable-regex:
      metavariable: $COMMENT
      regex: .*
  metadata:
    syntax_$COMMENT: matches_regex('(?i)(now|go through|iterate|loop|check|verify|calculate|compute|assign|set|get|return|call|function|method|class|if|else|for|while|with|try|except|finally|def|import|from).*')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex-based detection may have false positives/negatives; semantic
          intent is difficult to capture fully.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to analyze comment text; not a built-in
          rule.
    original_description: Detect comments that merely describe the code, assuming
      the reader knows Python.
