rules:
- id: javascript-number-literal-prefix-case
  message: Use `0x`, `0o`, `0b` prefixes with lowercase letters. Never include leading
    zero unless followed by `x`, `o`, `b`.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $NUM
  - metavariable-type:
      metavariable: $NUM
      type: expr
  metadata:
    syntax_$NUM: not matches_regex('^0[xob][0-9a-fA-F_]+$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires regex matching on numeric literals
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for numeric literal patterns
    original_description: Use `0x`, `0o`, `0b` prefixes with lowercase letters. Never
      include leading zero unless followed by `x`, `o`, `b`.
