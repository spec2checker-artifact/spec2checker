rules:
- id: cpp-nonmember-functions-in-namespace
  message: '[DISABLED] Prefer placing nonmember functions in a namespace; use completely
    global functions rarely.'
  languages:
  - cpp
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Prefer placing nonmember functions in a namespace; use completely
      global functions rarely.
