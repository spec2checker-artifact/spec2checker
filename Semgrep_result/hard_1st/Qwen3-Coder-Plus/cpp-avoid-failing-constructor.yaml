rules:
- id: cpp-avoid-failing-constructor
  message: Avoid initialization that can fail in constructors if you can't signal
    an error. Consider factory functions or `Init()` methods.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: "$CLASS::$CLASS($ARGS) {\n    ...\n}"
  - metavariable-type:
      metavariable: $CLASS
      type: type
  - metavariable-type:
      metavariable: $ARGS
      type: expr
  metadata:
    syntax_constructor: calls_function_matching('malloc|new|fopen|open|connect|throw')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern for specific failing calls; may have false positives
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires custom query to detect failing initialization patterns
    original_description: Avoid initialization that can fail in constructors if you
      can't signal an error. Consider factory functions or `Init()` methods.
