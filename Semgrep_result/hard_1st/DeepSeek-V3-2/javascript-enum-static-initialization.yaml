rules:
- id: javascript-enum-static-initialization
  message: For string enums, all values must be statically initialized, not computed
    with arithmetic, template literals, function calls, or variable references.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: "$ENUM: {\n    ...\n    $KEY: $VALUE,\n    ...\n}"
  - metavariable-type:
      metavariable: $KEY
      type: expr
  - metavariable-type:
      metavariable: $VALUE
      type: expr
  metadata:
    syntax_$VALUE: is_not_static_initializer
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match non-static initializers (e.g., binary
          expressions, template literals, calls)
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect non-static enum values
    original_description: For string enums, all values must be statically initialized,
      not computed with arithmetic, template literals, function calls, or variable
      references.
