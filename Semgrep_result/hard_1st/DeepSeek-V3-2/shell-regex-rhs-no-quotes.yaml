rules:
- id: shell-regex-rhs-no-quotes
  message: When using the regex matching operator `=~` inside `[[ ... ]]`, the right-hand
    side (RHS) should not be quoted, as quoting would cause it to be treated as a
    literal string instead of a regular expression.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: '[[ $LHS =~ $RHS ]]'
  - metavariable-type:
      metavariable: $LHS
      type: expr
  - metavariable-type:
      metavariable: $RHS
      type: expr
  metadata:
    syntax_$RHS: is_quoted_string
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep's Bash/Shell support may not fully resolve variable expansions
          to determine if the RHS is a quoted literal.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Shell/Bash analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: CodeQL's Bash/Shell support is experimental; detecting quoted
          strings in this context may be limited.
    original_description: When using the regex matching operator `=~` inside `[[ ...
      ]]`, the right-hand side (RHS) should not be quoted, as quoting would cause
      it to be treated as a literal string instead of a regular expression.
