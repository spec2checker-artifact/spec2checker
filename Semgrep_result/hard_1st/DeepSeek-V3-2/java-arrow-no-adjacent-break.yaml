rules:
- id: java-arrow-no-adjacent-break
  message: Line never broken adjacent to arrow ->, except break may come immediately
    after arrow if following text is a single unbraced expression. For block body,
    no break adjacent.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: $EXPR -> $BODY
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  - metavariable-type:
      metavariable: $BODY
      type: expr
  metadata:
    syntax_$BODY: is_block
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise detection of line breaks relative to tokens
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for line break adjacency
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for formatting rule
    original_description: Line never broken adjacent to arrow ->, except break may
      come immediately after arrow if following text is a single unbraced expression.
      For block body, no break adjacent.
