rules:
- id: shell-constant-readonly
  message: Use `readonly` or `declare -xr` for constants instead of equivalent commands
    for clarity.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: export $VAR=$VAL
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $VAL
      type: expr
  metadata:
    syntax_$VAR: not_preceded_by('readonly')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern for export without preceding readonly
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Use `readonly` or `declare -xr` for constants instead of
      equivalent commands for clarity.
