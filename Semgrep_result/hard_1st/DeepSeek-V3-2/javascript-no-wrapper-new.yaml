rules:
- id: javascript-no-wrapper-new
  message: Never use `new Boolean`, `new Number`, `new String`, `new Symbol`. Use
    coercion functions instead.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: new $WRAPPER($ARG)
  - metavariable-regex:
      metavariable: $WRAPPER
      regex: ^(Boolean|Number|String|Symbol)$
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Never use `new Boolean`, `new Number`, `new String`, `new
      Symbol`. Use coercion functions instead.
