rules:
- id: shell-no-expr-command
  message: Never use the `expr` command as it is an external program and slower than
    built-in shell arithmetic.
  languages:
  - bash
  severity: WARNING
  pattern: expr $...
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match in comments or strings
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Never use the `expr` command as it is an external program
      and slower than built-in shell arithmetic.
