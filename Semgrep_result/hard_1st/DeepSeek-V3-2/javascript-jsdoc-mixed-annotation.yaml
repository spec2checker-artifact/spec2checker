rules:
- id: javascript-jsdoc-mixed-annotation
  message: Detects mixing of inline JSDoc type annotations and block JSDoc comments
    on the same variable declaration.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: const /** $TYPE */ $VAR = $EXPR;
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_$VAR: has_leading_comment
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern may match valid inline annotations; requires additional
          logic to detect preceding block JSDoc.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect mixed annotation styles.
    original_description: Detects mixing of inline JSDoc type annotations and block
      JSDoc comments on the same variable declaration.
