rules:
- id: python-docstring-triple-double-quote
  message: Always use the three-double-quote format `"""` for docstrings (per PEP
    257).
  languages:
  - python
  severity: WARNING
  pattern-regex: "^\\s*'''"
  metadata:
    syntax_$DOC: not matches_regex('^"""')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match docstring nodes and check their quote
          style
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect docstring quote style
    original_description: Always use the three-double-quote format `"""` for docstrings
      (per PEP 257).
