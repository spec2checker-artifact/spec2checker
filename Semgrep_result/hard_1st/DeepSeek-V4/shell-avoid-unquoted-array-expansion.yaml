rules:
- id: shell-avoid-unquoted-array-expansion
  message: Avoid unquoted expansion in array assignments; won't work correctly if
    output contains special characters or whitespace. Use `readarray` instead.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $ARRAY=($($CMD))
  - metavariable-type:
      metavariable: $ARRAY
      type: expr
  - metavariable-type:
      metavariable: $CMD
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match legitimate uses of command substitution not
          in array context
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Avoid unquoted expansion in array assignments; won't work
      correctly if output contains special characters or whitespace. Use `readarray`
      instead.
