rules:
- id: shell-no-main-for-short-scripts
  message: For short scripts where it's just a linear flow, a main function is overkill
    and not required.
  languages:
  - bash
  severity: WARNING
  pattern: "main() {\n    ...\n}"
  metadata:
    syntax_file: function_count == 1
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: line and function count constraints require custom logic
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for line/function count heuristics
    original_description: For short scripts where it's just a linear flow, a main
      function is overkill and not required.
