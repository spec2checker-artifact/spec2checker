rules:
- id: cpp-dynamic-cast-usage
  message: Use `dynamic_cast` only when you must query the dynamic type. Prefer virtual
    methods.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: dynamic_cast<$TYPE>($EXPR)
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    type_constraint_$EXPR: is_pointer_or_reference_to_polymorphic_type()
    type_constraint_$TYPE: is_pointer_or_reference_to_polymorphic_type()
    capabilities_required:
      cross_file: false
      inheritance_analysis: true
      dataflow: false
      type_resolution: true
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires type resolution for polymorphic check
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: true
    original_description: Use `dynamic_cast` only when you must query the dynamic
      type. Prefer virtual methods.
