rules:
- id: java-text-block-opening-newline
  message: Opening triple quotes of a text block must be on a new line, optionally
    following indentation rules.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: String $VAR = """$TEXT;
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $TEXT
      type: expr
  metadata:
    syntax_TEXT: not_starts_with_newline
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise detection of newline after opening quotes
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for text block formatting
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires AST analysis of string literal structure
    original_description: Opening triple quotes of a text block must be on a new line,
      optionally following indentation rules.
