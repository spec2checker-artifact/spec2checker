rules:
- id: cpp-explicit-single-argument-constructor
  message: '[DISABLED] Type conversion operators and constructors callable with a
    single argument must be marked explicit. Copy/move constructors are exceptions.'
  languages:
  - cpp
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Type conversion operators and constructors callable with
      a single argument must be marked explicit. Copy/move constructors are exceptions.
