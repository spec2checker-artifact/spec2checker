rules:
- id: python-avoid-string-concat-in-loop
  message: Avoid using '+' and '+=' to accumulate a string in a loop; use list.append
    and ''.join to avoid quadratic behavior.
  languages:
  - python
  severity: WARNING
  pattern: "for $VAR in $ITER:\n    $ACCUM = $ACCUM + $EXPR"
  metadata:
    syntax_$ACCUM: is_same_variable
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
        limitations: May require multiple patterns to catch all variations (e.g.,
          '+=').
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query; not a built-in rule.
    original_description: Avoid using '+' and '+=' to accumulate a string in a loop;
      use list.append and ''.join to avoid quadratic behavior.
