rules:
- id: javascript-non-ascii-characters
  message: Use actual Unicode character or hex/Unicode escape; choose for readability.
    Unicode escapes outside string literals/comments discouraged.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $EXPR
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_$EXPR: contains_non_ascii_escape()
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom pattern for Unicode escape detection
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for escape sequence analysis
    original_description: Use actual Unicode character or hex/Unicode escape; choose
      for readability. Unicode escapes outside string literals/comments discouraged.
