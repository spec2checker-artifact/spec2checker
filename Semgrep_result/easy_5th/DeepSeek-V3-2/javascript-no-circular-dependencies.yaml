rules:
- id: javascript-no-circular-dependencies
  message: Do not create cycles between ES modules, even though specification allows.
    Includes cycles via `import` and `export from`.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: import $IMPORT from $SOURCE;
  - metavariable-type:
      metavariable: $SOURCE
      type: expr
  metadata:
    capabilities_required:
      cross_file: true
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires cross-file analysis and dependency graph construction,
          which is not natively supported in pattern matching.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires building a custom query to detect cycles in the import
          graph.
    original_description: Do not create cycles between ES modules, even though specification
      allows. Includes cycles via `import` and `export from`.
