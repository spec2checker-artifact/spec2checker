rules:
- id: java-package-no-line-wrap
  message: The package declaration must not be line-wrapped. The column limit does
    not apply.
  languages:
  - java
  severity: ERROR
  patterns:
  - pattern: package $PKG;
  - metavariable-type:
      metavariable: $PKG
      type: expr
  metadata:
    syntax_package: multi_line
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires checking that the package statement is on a single line
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule to detect line-wrapping in package declarations
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires querying for package declarations and checking line
          breaks
    original_description: The package declaration must not be line-wrapped. The column
      limit does not apply.
