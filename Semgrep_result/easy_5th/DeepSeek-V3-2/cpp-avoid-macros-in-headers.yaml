rules:
- id: cpp-avoid-macros-in-headers
  message: Avoid defining macros, especially in header files. Prefer inline functions,
    enums, and const/constexpr variables.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: '#define $MACRO ...'
  - metavariable-regex:
      metavariable: $MACRO
      regex: ^[A-Z_][A-Z0-9_]*$
  metadata:
    syntax_file: file_extension_matches('h|hpp|hxx|hh')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can detect macro definitions but cannot enforce project-specific
          prefix or undef patterns.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can detect macro definitions but requires custom query for header
          file context.
    original_description: Avoid defining macros, especially in header files. Prefer
      inline functions, enums, and const/constexpr variables.
