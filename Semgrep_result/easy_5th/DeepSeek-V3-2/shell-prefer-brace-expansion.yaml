rules:
- id: shell-prefer-brace-expansion
  message: Use ${var} instead of $var when a bare variable reference is immediately
    followed by an underscore and another identifier that could be mistaken as part
    of the variable name (e.g. writing $var_suffix when ${var}_suffix is intended).
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern-regex: '\$[a-zA-Z_]\w*_suffix\b'
  - pattern-not-regex: '\$\{[a-zA-Z_]\w*\}_suffix\b'
  metadata:
    syntax_$VAR: bare_variable_followed_by_suffix_ambiguity
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Only matches bare $var_suffix where intent is ${var}_suffix
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Prefer using ${var} over $var for variable expansion to
      avoid ambiguity.
