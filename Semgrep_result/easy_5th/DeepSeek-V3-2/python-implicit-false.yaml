rules:
- id: python-implicit-false
  message: Use implicit false evaluation for sequences, collections, and numeric zero
    instead of explicit comparisons to empty literals or len() checks.
  languages:
  - python
  severity: WARNING
  pattern: "if $VAR != []:\n    ..."
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires multiple patterns to cover all explicit false comparisons
          (e.g., != [], == 0, len() == 0)
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect all patterns
    original_description: Use implicit false evaluation for sequences, collections,
      and numeric zero instead of explicit comparisons to empty literals or len()
      checks.
