rules:
- id: shell-avoid-eval
  message: The `eval` builtin should be avoided as it munges input and can set variables
    unpredictably.
  languages:
  - bash
  severity: ERROR
  pattern: eval $...
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern may match safe uses of eval with static arguments.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis.
    original_description: The `eval` builtin should be avoided as it munges input
      and can set variables unpredictably.
