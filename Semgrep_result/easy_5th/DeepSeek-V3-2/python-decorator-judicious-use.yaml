rules:
- id: python-decorator-judicious-use
  message: Detect decorator stacking where 3 or more decorators are applied to a
    single function, indicating potential non-judicious overuse.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: "@$D1\n@$D2\n@$D3\ndef $FUNC(...):\n    ..."
  metadata:
    syntax_$DECORATOR: stacked_three_or_more_decorators
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
        limitations: None - only detects functions with 3+ stacked decorators
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect stacked decorators
    original_description: Detect decorator usage that may indicate non-judicious application,
      such as decorators with external dependencies or complex logic.
