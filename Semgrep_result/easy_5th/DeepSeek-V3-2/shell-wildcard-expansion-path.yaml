rules:
- id: shell-wildcard-expansion-path
  message: Use an explicit path when doing wildcard expansion of filenames (e.g.,
    `./*` instead of `*`) to prevent issues with filenames starting with `-`.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $CMD *
  - metavariable-type:
      metavariable: $CMD
      type: expr
  metadata:
    syntax_$CMD: is_command_name
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match false positives in non-shell contexts or complex
          command substitutions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Use an explicit path when doing wildcard expansion of filenames
      (e.g., `./*` instead of `*`) to prevent issues with filenames starting with
      `-`.
