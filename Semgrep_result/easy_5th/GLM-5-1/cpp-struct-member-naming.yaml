rules:
- id: cpp-struct-member-naming
  message: Data members of structs (both static and non-static) are named like ordinary
    nonmember variables, without trailing underscore.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: "struct $STRUCT {\n  ... $TYPE $MEMBER;\n  ...\n};"
  - metavariable-type:
      metavariable: $STRUCT
      type: type
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-regex:
      metavariable: $MEMBER
      regex: ^.*_$
  metadata:
    syntax_$MEMBER: name_ends_with('_')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match struct definitions only, not classes
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires distinguishing structs from classes via type resolution
    original_description: Data members of structs (both static and non-static) are
      named like ordinary nonmember variables, without trailing underscore.
