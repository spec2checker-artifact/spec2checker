rules:
- id: shell-prefer-brace-expansion
  message: Prefer using ${var} over $var for variable expansion to avoid ambiguity.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: "$$VAR"
  - pattern-not: "$${$$VAR}"
  - metavariable-regex:
      metavariable: $VAR
      regex: ^[a-zA-Z_][a-zA-Z0-9_]+$
  metadata:
    syntax_$VAR: not_preceded_by '{'
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires careful pattern to avoid false positives in complex
          expansions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Prefer using ${var} over $var for variable expansion to
      avoid ambiguity.