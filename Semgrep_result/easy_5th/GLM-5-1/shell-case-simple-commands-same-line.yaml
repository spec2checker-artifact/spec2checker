rules:
- id: shell-case-simple-commands-same-line
  message: Simple commands may be put on the same line as the pattern and `;;` as
    long as readable. Use space after `)` and before `;;`.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: "case $VAR in\n    $PATTERN) $CMD ;;\n    ...\nesac"
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $PATTERN
      type: expr
  - metavariable-type:
      metavariable: $CMD
      type: expr
  metadata:
    syntax_$CMD: is_simple_command
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires correct parsing of shell case statement structure
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Simple commands may be put on the same line as the pattern
      and `;;` as long as readable. Use space after `)` and before `;;`.
