rules:
- id: shell-parentheses-required
  message: Parentheses are required after the function name.
  languages:
  - bash
  severity: ERROR
  patterns:
  - pattern: "function $FUNC {\n    ...\n}"
  - pattern-not: "function $FUNC() {\n    ...\n}"
  - metavariable-regex:
      metavariable: $FUNC
      regex: ^[a-zA-Z_][a-zA-Z0-9_]*$
  metadata:
    syntax_$FUNC: missing_parentheses
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching for shell function definitions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Parentheses are required after the function name.