rules:
- id: cpp-missing-const-method
  message: Declare methods const unless they alter the logical state of the object
    or cannot be invoked concurrently.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: "class $CLASS {\n    ...\n    $RET $METHOD($PARAMS) { ... }\n    ...\n\
      }"
  - metavariable-type:
      metavariable: $CLASS
      type: type
  - metavariable-type:
      metavariable: $METHOD
      type: function
  - metavariable-type:
      metavariable: $RET
      type: expr
  - metavariable-type:
      metavariable: $PARAMS
      type: expr
  metadata:
    syntax_method: does_not_modify_member
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: cannot fully analyze logical state modification; may have false
          positives/negatives
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires complex dataflow analysis to determine logical state
          changes
    original_description: Declare methods const unless they alter the logical state
      of the object or cannot be invoked concurrently.
