rules:
- id: python-no-boolean-false-comparison
  message: 'Never compare a boolean variable to `False` using `==`. Use `if not x`
    instead. To distinguish `False` from `None`, chain: `if not x and x is not None`.'
  languages:
  - python
  severity: WARNING
  pattern: "if $X == False:\n    ..."
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for precise detection
    original_description: 'Never compare a boolean variable to `False` using `==`.
      Use `if not x` instead. To distinguish `False` from `None`, chain: `if not x
      and x is not None`.'
