rules:
- id: python-decorator-judicious-use
  message: Non-constructor @classmethod detected - consider whether this method really
    needs class-level access or if it should be a standalone function.
  languages:
  - python
  severity: INFO
  patterns:
  - pattern-either:
    - pattern: "@classmethod\ndef $FUNC(cls):\n    ..."
    - pattern: "@classmethod\ndef $FUNC(cls, ...):\n    ..."
  - pattern-not-regex: "field_validator"
  - pattern-not-regex: "return cls"
  - pattern-not-regex: 'def (from_|create_|new_|construct_|build_|setUp|set_default_|set_testsuites_|replacement_setupclass|api_base)\w*'
  - pattern-not-regex: 'def _\w+'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Narrowed to detect non-constructor @classmethod only; excludes
          @field_validator combos, private methods, named constructors, and framework methods
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect non-constructor classmethods
    original_description: Detect decorator usage that may indicate non-judicious application,
      such as decorators with external dependencies or complex logic.