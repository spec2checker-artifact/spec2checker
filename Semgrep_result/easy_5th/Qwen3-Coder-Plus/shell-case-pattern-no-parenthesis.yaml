rules:
- id: shell-case-pattern-no-parenthesis
  message: Pattern expressions in a case statement should not be preceded by an open
    parenthesis.
  languages:
  - bash
  severity: WARNING
  pattern: "case $VAR in\n    ($PATTERN)\n        ...\n    ;;\nesac"
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep's shell parsing may not correctly flag all parenthesized
          pattern cases.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis.
    original_description: Pattern expressions in a case statement should not be preceded
      by an open parenthesis.
