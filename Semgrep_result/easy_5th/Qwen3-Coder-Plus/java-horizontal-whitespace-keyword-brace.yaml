rules:
- id: java-horizontal-whitespace-keyword-brace
  message: Detect missing space between a closing curly brace } and the keyword that
    follows (else, catch).
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: '}$KW {'
  - metavariable-regex:
      metavariable: $KW
      regex: ^(else|catch)$
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep can match the pattern, but may not distinguish between
          valid and invalid spacing in all contexts.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not have a built-in rule for this specific spacing pattern;
          requires custom XPath
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires a custom query to detect missing whitespace between
          } and keyword.
    original_description: Detect missing space between a closing curly brace } and
      the keyword that follows (else, catch).
