rules:
- id: cpp-const-placement-consistency
  message: Check for consistency in the placement of the `const` qualifier in pointer
    declarations. While `const int*` is preferred, `int const*` is allowed, but the
    chosen style must be consistent within the analyzed scope.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $TYPE const* $VAR;
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can detect the pattern but requires custom logic for consistency
          checking across a file or project.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: Can query for const qualifier placement but consistency analysis
          requires custom query logic.
    original_description: Check for consistency in the placement of the `const` qualifier
      in pointer declarations. While `const int*` is preferred, `int const*` is allowed,
      but the chosen style must be consistent within the analyzed scope.
