rules:
- id: java-assignment-break-after-symbol
  message: Detect when a line break occurs before an assignment operator (=) or colon
    (:) in an enhanced for loop, where the break should typically be after the symbol.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: "$TYPE $VAR\n    = $EXPR;"
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_assignment: operator_location('before_newline')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern may match other constructs; requires precise line break
          detection.
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD has rules for formatting/whitespace but may not target this
          specific break pattern.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL is not designed for formatting/style rule detection.
    original_description: Detect when a line break occurs before an assignment operator
      (=) or colon (:) in an enhanced for loop, where the break should typically be
      after the symbol.
