rules:
- id: cpp-prefer-struct-over-pair
  message: Use a `struct` instead of `std::pair` or `std::tuple` when the elements
    can have meaningful names, to improve code clarity.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: std::pair<$T1, $T2> $VAR;
  - metavariable-type:
      metavariable: $T1
      type: expr
  - metavariable-type:
      metavariable: $T2
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern matches declaration only; cannot infer if names would
          be meaningful.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to assess meaningfulness of names.
    original_description: Use a `struct` instead of `std::pair` or `std::tuple` when
      the elements can have meaningful names, to improve code clarity.
