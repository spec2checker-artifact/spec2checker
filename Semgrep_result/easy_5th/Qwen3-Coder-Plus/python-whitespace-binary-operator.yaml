rules:
- id: python-whitespace-binary-operator
  message: Surround binary operators with a single space on either side for assignment,
    comparisons, and Booleans. Use judgment for arithmetic operators.
  languages:
  - python
  severity: WARNING
  pattern: $LEFT $OP $RIGHT
  metadata:
    syntax_$OP: is_binary_operator
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom pattern for each operator type; may not handle
          all edge cases like arithmetic operators where spacing is optional.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query; not a built-in rule.
    original_description: Surround binary operators with a single space on either
      side for assignment, comparisons, and Booleans. Use judgment for arithmetic
      operators.
