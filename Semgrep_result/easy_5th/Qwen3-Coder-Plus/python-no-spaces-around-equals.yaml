rules:
- id: python-no-spaces-around-equals
  message: Never use spaces around `=` when passing keyword arguments or defining
    default parameter values, unless a type annotation is present.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: $ARG = $VAL
  - pattern-inside: '@true

      ...'
  metadata:
    syntax_$ARG: is_keyword_argument_or_default_param
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match `=` with surrounding spaces and exclude
          cases with type annotations
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect whitespace in keyword/default
          arguments
    original_description: Never use spaces around `=` when passing keyword arguments
      or defining default parameter values, unless a type annotation is present.
