rules:
- id: javascript-no-const-exports
  message: Do not annotate `exports` object as `@const`; it is already treated as
    constant.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: /** @const */ exports = $EXPR
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires JSDoc comment parsing
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for JSDoc comment detection
    original_description: Do not annotate `exports` object as `@const`; it is already
      treated as constant.
