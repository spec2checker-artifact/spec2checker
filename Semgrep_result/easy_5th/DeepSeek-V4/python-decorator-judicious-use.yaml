rules:
- id: python-decorator-judicious-use
  message: Detect decorator usage that may indicate non-judicious application, such
    as decorators with external dependencies or complex logic.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: "@$DECORATOR\ndef $FUNC(...):\n    ..."
  - pattern-not: "@property\ndef $FUNC(...):\n    ..."
  - pattern-not: "@$DECOR.setter\ndef $FUNC(...):\n    ..."
  - pattern-not: "@$DECOR.deleter\ndef $FUNC(...):\n    ..."
  - pattern-not: "@classmethod\ndef $FUNC(...):\n    ..."
  - pattern-not: "@staticmethod\ndef $FUNC(...):\n    ..."
  - pattern-not: "@abstractmethod\ndef $FUNC(...):\n    ..."
  - pattern-not: "@contextlib.$CTX\ndef $FUNC(...):\n    ..."
  - pattern-not: "@typing.$TYPE\ndef $FUNC(...):\n    ..."
  - pattern-not: "@asyncio.$ASYNC\ndef $FUNC(...):\n    ..."
  - pattern-not: "@functools.$FUNC2\ndef $FUNC(...):\n    ..."
  - pattern-not: "@dataclasses.$DC\ndef $FUNC(...):\n    ..."
  - pattern-not: "@pytest.$PYT\ndef $FUNC(...):\n    ..."
  - pattern-not: "@unittest.$UNT\ndef $FUNC(...):\n    ..."
  - pattern-not: "@$MOD.$DECOR\ndef $FUNC(...):\n    ..."
  metadata:
    syntax_$DECORATOR: contains_import_call
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cannot fully analyze decorator body for external dependencies;
          relies on pattern matching for import calls within the decorator expression.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect decorators with import calls;
          not a built-in rule.
    original_description: Detect decorator usage that may indicate non-judicious application,
      such as decorators with external dependencies or complex logic.
