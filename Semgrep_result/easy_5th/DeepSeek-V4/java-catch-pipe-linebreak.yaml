rules:
- id: java-catch-pipe-linebreak
  message: Detect line break before the pipe operator '|' in a multi-catch clause.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: "catch ($EXCEPTION_TYPE\n        | $OTHER_EXCEPTION $VAR)"
  - metavariable-type:
      metavariable: $EXCEPTION_TYPE
      type: expr
  - metavariable-type:
      metavariable: $OTHER_EXCEPTION
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    syntax_catch: is_multi_catch
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match other uses of '|' operator
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for specific formatting
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires AST query for specific token positions
    original_description: Detect line break before the pipe operator '|' in a multi-catch
      clause.
