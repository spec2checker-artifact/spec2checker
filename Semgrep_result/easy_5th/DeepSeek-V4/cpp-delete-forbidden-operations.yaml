rules:
- id: cpp-delete-forbidden-operations
  message: Use `= delete` to explicitly delete copy/move operations.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $CLASS($PARAMS) = $OP;
  - metavariable-type:
      metavariable: $CLASS
      type: type
  - metavariable-type:
      metavariable: $PARAMS
      type: expr
  - metavariable-type:
      metavariable: $OP
      type: expr
  metadata:
    syntax_$OP: is_not('delete')
    syntax_$PARAMS: matches_pattern('const $CLASS&')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching for copy/move constructors and assignment
          operators
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires custom query to detect missing `= delete`
    original_description: Use `= delete` to explicitly delete copy/move operations.
