rules:
- id: python-imports-only-packages-modules
  message: Use import statements for packages and modules only, not for individual
    types, classes, or functions. Exemptions for typing, collections.abc, typing_extensions,
    six.moves.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: from $MODULE import $ITEM
  - pattern-not: from typing import $ITEM
  - pattern-not: from collections.abc import $ITEM
  - pattern-not: from typing_extensions import $ITEM
  - pattern-not: from six.moves import $ITEM
  - pattern-not: from __future__ import $ITEM
  - pattern-not: from absl import $ITEM
  - pattern-not: from absl.testing import $ITEM
  - pattern-not: from absl.flags import $ITEM
  - pattern-not: from google.protobuf import $ITEM
  - pattern-not: from src.test.py.bazel import $ITEM
  - pattern-not: from unittest import $ITEM
  - pattern-not: from urllib import $ITEM
  - pattern-not: from xml.sax import $ITEM
  - pattern-not: from abc import $ITEM
  - pattern-not: from http import $ITEM
  - pattern-not: from collections import $ITEM
  - pattern-not: from src.main.protobuf import $ITEM
  - pattern-not: from ctypes import $ITEM
  - pattern-not: from os import $ITEM
  - pattern-not: from email import $ITEM
  - pattern-not: from html import $ITEM
  - pattern-not: from logging import $ITEM
  - pattern-not: from pathlib import $ITEM
  - pattern-not: from xml import $ITEM
  - pattern-not: from importlib import $ITEM
  - pattern-not: from io import $ITEM
  - pattern-not: from csv import $ITEM
  - pattern-not: from concurrent import $ITEM
  - pattern-not: from asyncio import $ITEM
  - pattern-not: from multiprocessing import $ITEM
  - pattern-not: from platform import $ITEM
  - pattern-not: from zoneinfo import $ITEM
  - pattern-not: from opentelemetry import $ITEM
  - pattern-not: from letta.constants import $ITEM
  - pattern-not: from letta.schemas.enums import $ITEM
  - pattern-not: from letta.errors import $ITEM
  - pattern-not: from letta.local_llm.constants import $ITEM
  - pattern-not: from letta.settings import $ITEM
  - pattern-not: from letta.schemas.letta_message_content import $ITEM
  - pattern-not: from letta.schemas.letta_stop_reason import $ITEM
  - pattern-not: from letta.schemas.openai import $ITEM
  - pattern-not: from letta.schemas.providers import $ITEM
  - pattern-not: from letta.schemas.secret import $ITEM
  - pattern-not: from letta.orm import $ITEM
  - pattern-not: from letta.server.rest_api import $ITEM
  - pattern-not: from letta.services import $ITEM
  - pattern-not: from letta.local_llm import $ITEM
  - pattern-not: from letta.llm_api import $ITEM
  - pattern-not: from anthropic.types import $ITEM
  - pattern-not: from opentelemetry.trace import $ITEM
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: exemption list may need manual extension
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for exemption list
    original_description: Use import statements for packages and modules only, not
      for individual types, classes, or functions. Exemptions for typing, collections.abc,
      typing_extensions, six.moves.
