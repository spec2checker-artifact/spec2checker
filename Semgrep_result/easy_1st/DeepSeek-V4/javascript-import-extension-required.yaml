rules:
- id: javascript-import-extension-required
  message: ES module import paths must include the `.js` file extension.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: import $IMPORT from "$PATH";
  - metavariable-regex:
      metavariable: $PATH
      regex: ^(?!.*\.js$).*$
  metadata:
    syntax_$PATH: is_import_specifier
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex pattern may have edge cases with complex path strings
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check import path strings
    original_description: ES module import paths must include the `.js` file extension.
