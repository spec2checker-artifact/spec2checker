rules:
- id: cpp-const-method-missing
  message: Declare methods const unless they alter the logical state of the object
    or cannot be invoked concurrently.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: "class $CLASS {\n    ...\n    $RET $METHOD($PARAMS) { ... }\n    ...\n\
      }"
  - metavariable-type:
      metavariable: $CLASS
      type: type
  - metavariable-type:
      metavariable: $METHOD
      type: function
  - metavariable-type:
      metavariable: $RET
      type: expr
  - metavariable-type:
      metavariable: $PARAMS
      type: expr
  metadata:
    syntax_method: calls_non_const_member == false
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: true
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires dataflow analysis to detect state modifications; may
          have false positives/negatives
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires complex dataflow and type analysis for accurate detection
    original_description: Declare methods const unless they alter the logical state
      of the object or cannot be invoked concurrently.
