rules:
- id: cpp-no-using-namespace-std
  message: Do not declare anything in namespace std, including forward declarations.
    Use standard headers instead.
  languages:
  - cpp
  severity: ERROR
  pattern: using namespace std;
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Do not declare anything in namespace std, including forward
      declarations. Use standard headers instead.
