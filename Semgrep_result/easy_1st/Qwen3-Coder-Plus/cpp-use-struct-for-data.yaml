rules:
- id: cpp-use-struct-for-data
  message: Use `struct` for passive objects that carry data, with all fields public
    and no invariants. If in doubt, use `class`.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: class $CLASS { ... }
  - metavariable-type:
      metavariable: $CLASS
      type: type
  metadata:
    syntax_$CLASS: has_no_inheritance
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to check for public members and lack of methods/inheritance
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires custom query to check for data-only classes
    original_description: Use `struct` for passive objects that carry data, with all
      fields public and no invariants. If in doubt, use `class`.
