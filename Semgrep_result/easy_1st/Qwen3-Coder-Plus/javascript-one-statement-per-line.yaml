rules:
- id: javascript-one-statement-per-line
  message: Detect multiple statements on a single line separated by semicolons
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $STMT1; $STMT2
  - metavariable-type:
      metavariable: $STMT1
      type: expr
  - metavariable-type:
      metavariable: $STMT2
      type: expr
  metadata:
    syntax_$STMT1: is_statement
    syntax_$STMT2: is_statement
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: may match within strings or comments; requires precise statement
          detection
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for statement separation
    original_description: Detect multiple statements on a single line separated by
      semicolons
