rules:
- id: javascript-avoid-goog-module-declarelegacynamespace
  message: Avoid `goog.module.declareLegacyNamespace()` when possible; exists for
    transition. Has naming restrictions.
  languages:
  - javascript
  severity: WARNING
  pattern: goog.module.declareLegacyNamespace();
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires specific library modeling for Closure Library
    original_description: Avoid `goog.module.declareLegacyNamespace()` when possible;
      exists for transition. Has naming restrictions.
