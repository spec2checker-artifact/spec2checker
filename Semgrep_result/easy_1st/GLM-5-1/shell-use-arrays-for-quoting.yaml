rules:
- id: shell-use-arrays-for-quoting
  message: Use arrays for safe quoting of lists of elements, especially command-line
    flags, to avoid word splitting and globbing issues.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $ARRAY=( $... ); $CMD $...
  - metavariable-type:
      metavariable: $ARRAY
      type: expr
  - metavariable-type:
      metavariable: $CMD
      type: expr
  metadata:
    syntax_$CMD: not_contains('[@]')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match safe usages; requires manual review for false
          positives
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Use arrays for safe quoting of lists of elements, especially
      command-line flags, to avoid word splitting and globbing issues.
