rules:
- id: python-whitespace-binary-operator
  message: Surround binary operators for assignment, comparisons, and Booleans with
    a single space on either side. Use judgment for arithmetic operators.
  languages:
  - python
  severity: WARNING
  pattern: $LEFT$OP$RIGHT
  metadata:
    syntax_$OP: is_binary_operator
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom pattern for each operator type; may have false
          positives in complex expressions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for formatting rules
    original_description: Surround binary operators for assignment, comparisons, and
      Booleans with a single space on either side. Use judgment for arithmetic operators.
