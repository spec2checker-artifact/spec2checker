rules:
- id: shell-use-dollar-paren-instead-of-backticks
  message: Use $(command) instead of backticks for command substitution.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: '`$CMD`'
  - metavariable-type:
      metavariable: $CMD
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep supports shell patterns but may not handle all nested
          quoting contexts.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis.
    original_description: Use $(command) instead of backticks for command substitution.
