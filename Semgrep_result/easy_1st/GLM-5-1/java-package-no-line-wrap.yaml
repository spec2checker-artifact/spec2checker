rules:
- id: java-package-no-line-wrap
  message: The package declaration is not line-wrapped. The column limit does not
    apply.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: package $PKG;
  - metavariable-type:
      metavariable: $PKG
      type: expr
  metadata:
    syntax_statement: line_count > 1
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires pattern to detect multi-line package statements, which
          may be rare.
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD's AbstractNcssCount rule can count lines, but a custom rule
          is needed to check for line-wrapping specifically.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires a custom query to check the source location span of
          the package declaration.
    original_description: The package declaration is not line-wrapped. The column
      limit does not apply.
