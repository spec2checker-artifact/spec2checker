rules:
- id: shell-avoid-single-string-args
  message: Using a single string for multiple command arguments should be avoided;
    leads to eval or quoting nightmares.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $CMD $FLAGS
  - metavariable-regex:
      metavariable: $FLAGS
      regex: ^['"].*--.*['"]$
  - metavariable-regex:
      metavariable: $CMD
      regex: ^(?!fail|echo|assert_build|assert_build_fails|printf|cat|tee|warn|error|log|die|exit|add_rules_java)
  metadata:
    syntax_$FLAGS: is_string_literal
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: regex may not capture all complex string patterns
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Using a single string for multiple command arguments should
      be avoided; leads to eval or quoting nightmares.