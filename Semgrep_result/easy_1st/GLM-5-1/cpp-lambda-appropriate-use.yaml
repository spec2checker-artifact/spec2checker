rules:
- id: cpp-lambda-appropriate-use
  message: Use lambda expressions where appropriate; prefer explicit captures when
    lambda will escape current scope.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: '[$CAPTURE]($PARAMS) { $BODY }'
  - metavariable-type:
      metavariable: $CAPTURE
      type: expr
  - metavariable-type:
      metavariable: $PARAMS
      type: expr
  - metavariable-type:
      metavariable: $BODY
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cannot statically determine if lambda escapes scope to enforce
          explicit capture preference.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect escaping lambdas and suggest
          explicit captures.
    original_description: Use lambda expressions where appropriate; prefer explicit
      captures when lambda will escape current scope.
