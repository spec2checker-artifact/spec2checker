rules:
- id: shell-variable-expansion-quote
  message: Variable expansions should be quoted to prevent word splitting and globbing.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $VAR
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    syntax_$VAR: is_unquoted_variable_expansion
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match unquoted $VAR in command arguments,
          may have false positives in arithmetic contexts
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Variable expansions should be quoted to prevent word splitting
      and globbing.
