rules:
- id: shell-no-quote-match-expr
  message: In general, there is no need to quote match expressions in a case statement.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: "case $VAR in\n    '$PATTERN')\n        ...\n    ;;\nesac"
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $PATTERN
      type: expr
  metadata:
    syntax_$PATTERN: is_string_literal
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching for shell case statements
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: In general, there is no need to quote match expressions
      in a case statement.
