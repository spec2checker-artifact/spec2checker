rules:
- id: cpp-prefer-struct-over-pair-tuple
  message: Use a `struct` instead of `pair` or `tuple` whenever elements can have
    meaningful names.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: 'std::pair<$T1, $T2> $VAR;

      std::tuple<$T...> $VAR2;'
  - metavariable-type:
      metavariable: $T1
      type: expr
  - metavariable-type:
      metavariable: $T2
      type: expr
  - metavariable-type:
      metavariable: $T
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $VAR2
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: cannot determine if a struct with meaningful names is a better
          alternative
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to suggest refactoring
    original_description: Use a `struct` instead of `pair` or `tuple` whenever elements
      can have meaningful names.
