rules:
- id: javascript-import-no-line-wrap
  message: ES module import statements must not be line wrapped; they are an exception
    to the 80-column limit.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: |
      import $IMPORTS from $SOURCE;
  - pattern-not: import $A from $B;
  metadata:
    syntax_statement: line_count > 1
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to detect multi-line import statements
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for line-wrapping detection
    original_description: ES module import statements must not be line wrapped; they
      are an exception to the 80-column limit.
