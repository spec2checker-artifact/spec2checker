rules:
- id: shell-avoid-single-string-args
  message: Using a single string for multiple command arguments should be avoided;
    leads to `eval` or quoting nightmares.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $CMD $FLAGS
  - metavariable-regex:
      metavariable: $FLAGS
      regex: ^'[^']*--.*'$|^"[^"]*--.*"$
  - pattern-not: echo ...
  - pattern-not: fail ...
  - pattern-not: log ...
  - pattern-not: warn ...
  - pattern-not: info ...
  - pattern-not: error ...
  - pattern-not: printf ...  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match quoted strings not used as command arguments
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Using a single string for multiple command arguments should
      be avoided; leads to `eval` or quoting nightmares.
