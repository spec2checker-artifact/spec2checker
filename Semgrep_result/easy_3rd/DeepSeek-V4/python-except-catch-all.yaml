rules:
- id: python-except-catch-all
  message: Never use catch-all `except:` statements, or catch `Exception` or `StandardError`,
    unless re-raising or creating an isolation point. Catches everything including
    `sys.exit()` and `Ctrl+C`.
  languages:
  - python
  severity: ERROR
  pattern: "except $EXC:\n    ..."
  metadata:
    syntax_$EXC: matches_pattern('') OR matches_pattern('Exception') OR matches_pattern('StandardError')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match empty, 'Exception', and 'StandardError'
          catch clauses; may need additional logic to detect re-raising or isolation
          points.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect catch-all except clauses and
          exclude re-raising/isolation points.
    original_description: Never use catch-all `except:` statements, or catch `Exception`
      or `StandardError`, unless re-raising or creating an isolation point. Catches
      everything including `sys.exit()` and `Ctrl+C`.
