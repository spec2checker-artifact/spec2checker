rules:
- id: javascript-named-imports-no-alias
  message: Prefer keeping the same name for named imports; avoid aliasing. Use module
    import to fix collisions.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: import { $IMPORT as $ALIAS } from $MODULE
  - metavariable-type:
      metavariable: $IMPORT
      type: expr
  - metavariable-type:
      metavariable: $ALIAS
      type: expr
  - metavariable-type:
      metavariable: $MODULE
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect unnecessary aliasing
    original_description: Prefer keeping the same name for named imports; avoid aliasing.
      Use module import to fix collisions.
