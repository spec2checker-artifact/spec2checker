rules:
- id: javascript-horizontal-whitespace-reserved-word-parenthesis
  message: Space separating reserved word (if, for, catch) from open parenthesis (.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: if ( $COND )
  - metavariable-type:
      metavariable: $COND
      type: expr
  metadata:
    syntax_keyword: is_reserved_word
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern for each reserved word; may not handle all edge
          cases like nested parentheses
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for whitespace detection
    original_description: Space separating reserved word (if, for, catch) from open
      parenthesis (.
