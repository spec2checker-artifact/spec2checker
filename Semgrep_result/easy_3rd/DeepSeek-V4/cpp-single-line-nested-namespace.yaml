rules:
- id: cpp-single-line-nested-namespace
  message: Single-line nested namespace declarations are preferred in new code.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: namespace $NS1::$NS2 { ... }
  - metavariable-type:
      metavariable: $NS1
      type: expr
  - metavariable-type:
      metavariable: $NS2
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern matches syntax but cannot enforce preference over multi-line
          style
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect and compare namespace declaration
          styles
    original_description: Single-line nested namespace declarations are preferred
      in new code.
