rules:
- id: cpp-avoid-long-double
  message: Avoid using the `long double` type because it gives non-portable results.
    Use `double` instead.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: long double $VAR;
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Avoid using the `long double` type because it gives non-portable
      results. Use `double` instead.
