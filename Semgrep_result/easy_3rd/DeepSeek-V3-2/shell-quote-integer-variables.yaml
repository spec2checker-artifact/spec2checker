rules:
- id: shell-quote-integer-variables
  message: 'Optionally quote shell-internal, readonly special variables that are integers:
    $?, $#, $$, $!. Prefer quoting named internal integer variables (e.g., PPID) for
    consistency. It''s ok to not quote inside (( )).'
  languages:
  - bash
  severity: WARNING
  pattern: never_match_this_disabled_rule
  metadata:
    syntax_$VAR: not_inside_arithmetic_expansion
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep for shell may not fully parse arithmetic context (( )).
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis.
    original_description: 'Optionally quote shell-internal, readonly special variables
      that are integers: $?, $#, $$, $!. Prefer quoting named internal integer variables
      (e.g., PPID) for consistency. It''s ok to not quote inside (( )).'
