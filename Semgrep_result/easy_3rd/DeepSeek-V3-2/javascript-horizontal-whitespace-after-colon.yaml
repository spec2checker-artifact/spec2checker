rules:
- id: javascript-horizontal-whitespace-after-colon
  message: Require a space after the colon in an object literal key-value pair.
  languages:
  - javascript
  severity: WARNING
  pattern-regex: '([\w$_]+|"[^"]*"|\'[^\']*\')\s*:[\w$_"\'\[\{(]'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Switched to pattern-regex matching colon followed by non-space
          character; eliminates FP where space already exists after colon.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query for whitespace checking; not a standard
          security query.
    original_description: Require a space after the colon in an object literal key-value
      pair.
