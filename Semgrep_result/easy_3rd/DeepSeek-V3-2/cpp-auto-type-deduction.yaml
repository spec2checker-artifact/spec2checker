rules:
- id: cpp-auto-type-deduction
  message: For local variables, use `auto` when type information is obvious or irrelevant,
    such as when initializing with a constructor call or factory function.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $TYPE $VAR = $INIT;
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $INIT
      type: expr
  metadata:
    syntax_$TYPE: is_not_auto
    syntax_$INIT: is_constructor_or_factory_call
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: true
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom logic to determine if type is 'obvious' from
          the initializer
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires complex type analysis to determine 'obvious' type deduction
    original_description: For local variables, use `auto` when type information is
      obvious or irrelevant, such as when initializing with a constructor call or
      factory function.
