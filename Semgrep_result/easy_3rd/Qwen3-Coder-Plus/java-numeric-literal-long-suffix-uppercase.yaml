rules:
- id: java-numeric-literal-long-suffix-uppercase
  message: long-valued integer literals must use uppercase L suffix, never lowercase
    l, to avoid confusion with digit 1.
  languages:
  - java
  severity: ERROR
  patterns:
  - pattern: $NUMl
  - metavariable-regex:
      metavariable: $NUM
      regex: \d+
  metadata:
    syntax_$NUM: ends_with('l')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: true
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: long-valued integer literals must use uppercase L suffix,
      never lowercase l, to avoid confusion with digit 1.
