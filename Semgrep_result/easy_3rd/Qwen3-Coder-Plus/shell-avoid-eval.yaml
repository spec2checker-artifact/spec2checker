rules:
- id: shell-avoid-eval
  message: The `eval` command should be avoided as it munges input and can set variables
    unpredictably.
  languages:
  - bash
  severity: ERROR
  patterns:
  - pattern: eval $EXPR
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep supports shell syntax but may have limited context for
          complex command substitutions.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis.
    original_description: The `eval` command should be avoided as it munges input
      and can set variables unpredictably.
