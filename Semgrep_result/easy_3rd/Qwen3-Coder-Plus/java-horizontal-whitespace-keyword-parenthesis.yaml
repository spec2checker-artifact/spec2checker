rules:
- id: java-horizontal-whitespace-keyword-parenthesis
  message: Detect missing space between a keyword (if, for, catch, etc.) and the opening
    parenthesis that follows.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: if($COND) ...
  - metavariable-type:
      metavariable: $COND
      type: expr
  metadata:
    syntax_keyword: keyword_matches('if|for|while|switch|catch')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern for each keyword; may not handle all macro expansions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not have a built-in rule for this specific spacing check;
          requires custom XPath
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for formatting rules
    original_description: Detect missing space between a keyword (if, for, catch,
      etc.) and the opening parenthesis that follows.
