rules:
- id: javascript-no-mixed-object-keys
  message: Object literals should not mix quoted and unquoted keys, as they represent
    different semantics (dicts vs structs).
  languages:
  - javascript
  severity: WARNING
  pattern-either:
  - pattern-regex: '\{[^{}]*[a-zA-Z_$][a-zA-Z0-9_$]*\s*:[^{}]*"[^"]+"\s*:[^{}]*\}'
  - pattern-regex: '\{[^{}]*"[^"]+"\s*:[^{}]*[a-zA-Z_$][a-zA-Z0-9_$]*\s*:[^{}]*\}'
  metadata:
    syntax_object: has_mixed_key_types
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule to detect mixed quoted/unquoted keys within
          a single object
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check key types in object literals
    original_description: Object literals should not mix quoted and unquoted keys,
      as they represent different semantics (dicts vs structs).
