rules:
- id: javascript-spread-operator-preferred
  message: Function calls should use the spread operator `...` instead of `Function.prototype.apply`.
    No space should appear after the `...`.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $FUNC.apply($THIS, $ARRAY)
  - metavariable-type:
      metavariable: $FUNC
      type: expr
  - metavariable-type:
      metavariable: $THIS
      type: expr
  - metavariable-type:
      metavariable: $ARRAY
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern matches direct usage; may not detect all equivalent forms
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect and suggest replacement
    original_description: Function calls should use the spread operator `...` instead
      of `Function.prototype.apply`. No space should appear after the `...`.
