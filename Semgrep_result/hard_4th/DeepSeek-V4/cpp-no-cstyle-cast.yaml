rules:
- id: cpp-no-cstyle-cast
  message: Use C++-style casts (static_cast, const_cast, reinterpret_cast, std::bit_cast).
    Do not use C-style casts except to void. Brace initialization is allowed for arithmetic
    conversions.
  languages:
  - cpp
  severity: ERROR
  patterns:
  - pattern: ($TYPE) $EXPR
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_$TYPE: not_matches('void')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: May not distinguish all allowed void casts or brace initialization
          contexts.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to exclude void casts and brace initialization.
    original_description: Use C++-style casts (static_cast, const_cast, reinterpret_cast,
      std::bit_cast). Do not use C-style casts except to void. Brace initialization
      is allowed for arithmetic conversions.
