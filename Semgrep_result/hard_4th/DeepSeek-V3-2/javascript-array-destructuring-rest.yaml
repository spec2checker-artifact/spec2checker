rules:
- id: javascript-array-destructuring-rest
  message: Array literals on left-hand side for destructuring are allowed. A final
    rest element `...rest` is allowed (no space). Unused elements should be omitted.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: const [$VAR, ...$REST] = $EXPR;
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $REST
      type: expr
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Array literals on left-hand side for destructuring are allowed.
      A final rest element `...rest` is allowed (no space). Unused elements should
      be omitted.
