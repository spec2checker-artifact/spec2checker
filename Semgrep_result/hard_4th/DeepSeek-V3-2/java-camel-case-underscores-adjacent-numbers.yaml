rules:
- id: java-camel-case-underscores-adjacent-numbers
  message: In rare circumstances (e.g., multipart version numbers), use underscores
    to separate adjacent numbers in identifiers. Numbers have no case variants.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: $TYPE $ID = $VALUE
    - pattern: $TYPE $ID;
  - metavariable-regex:
      metavariable: $ID
      regex: (?i)[0-9][0-9]
  metadata:
    syntax_$ID: name_matches_regex('.*[0-9][0-9]+.*')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: restricted to variable/field declarations only to avoid matching
          string content and numeric literals
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for naming convention
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for identifier naming pattern
    original_description: In rare circumstances (e.g., multipart version numbers),
      use underscores to separate adjacent numbers in identifiers. Numbers have no
      case variants.
