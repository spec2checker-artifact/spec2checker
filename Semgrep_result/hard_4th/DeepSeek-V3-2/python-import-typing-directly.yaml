rules:
- id: python-import-typing-directly
  message: Always import symbols from `typing` or `collections.abc` themselves, not
    the module. Prefer abstract container types (e.g., `Sequence`) over concrete ones
    (e.g., `list`).
  languages:
  - python
  severity: WARNING
  pattern: 'import typing

    import collections.abc'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can detect simple import statements but cannot enforce preference
          for abstract types over concrete ones.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can detect import patterns but the preference for abstract types
          requires custom query logic.
    original_description: Always import symbols from `typing` or `collections.abc`
      themselves, not the module. Prefer abstract container types (e.g., `Sequence`)
      over concrete ones (e.g., `list`).
