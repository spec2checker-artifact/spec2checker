rules:
- id: javascript-tostring-override-constraints
  message: '[DISABLED] toString method overrides must always succeed and never have
    visible side effects. Avoid calling other methods that may throw.'
  languages:
  - javascript
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: toString method overrides must always succeed and never
      have visible side effects. Avoid calling other methods that may throw.
