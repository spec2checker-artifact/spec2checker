rules:
- id: javascript-no-mixed-object-keys
  message: Object literals should not mix quoted and unquoted keys, as they represent
    different semantics (dicts vs structs).
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: '{"$QKEY": $V1, $UKEY: $V2, ...}
    - pattern: '{$UKEY: $V1, "$QKEY": $V2, ...}
  metadata:
    syntax_object: has_mixed_key_types
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern restricted to object literals with explicit mixed quoted/unquoted
          keys
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check key types in object literals
    original_description: Object literals should not mix quoted and unquoted keys,
      as they represent different semantics (dicts vs structs).
