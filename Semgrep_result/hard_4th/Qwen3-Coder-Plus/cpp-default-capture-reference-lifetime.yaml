rules:
- id: cpp-default-capture-reference-lifetime
  message: Use default capture by reference ([&]) only when the lifetime of the lambda
    is obviously shorter than any potential captures.
  languages:
  - cpp
  severity: WARNING
  pattern: '[&]'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cannot statically verify lambda lifetime vs capture lifetime;
          rule flags all [&] uses.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: Requires complex lifetime analysis; may have high false positive
          rate.
    original_description: Use default capture by reference ([&]) only when the lifetime
      of the lambda is obviously shorter than any potential captures.
