rules:
- id: shell-readarray-without-t
  message: Detect usage of readarray without -t option, which leaves trailing newlines
    in array elements
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: readarray $ARGS
  - metavariable-type:
      metavariable: $ARGS
      type: expr
  metadata:
    syntax_$ARGS: not_contains('-t')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching for command arguments
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Detect usage of readarray without -t option, which leaves
      trailing newlines in array elements
