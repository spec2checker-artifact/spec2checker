rules:
- id: javascript-no-builtin-modification
  message: Detects modifications to built-in object prototypes or constructors, such
    as adding methods to Array.prototype or Object. Modifying built-in types is forbidden.
    JSCompiler polyfills are an allowed exception.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: $BUILTIN.prototype.$PROP = $EXPR
  - metavariable-regex:
      metavariable: $BUILTIN
      regex: ^(Array|Object|String|Number|Boolean|Function|Date|RegExp|Error|Map|Set|Promise)$
  - metavariable-type:
      metavariable: $PROP
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: May not detect all built-in object names or modifications via
          bracket notation (e.g., Array.prototype['foo']).
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect modifications to built-in prototypes.
    original_description: Detects modifications to built-in object prototypes or constructors,
      such as adding methods to Array.prototype or Object. Modifying built-in types
      is forbidden. JSCompiler polyfills are an allowed exception.
