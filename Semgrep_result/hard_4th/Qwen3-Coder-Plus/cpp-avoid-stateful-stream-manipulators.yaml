rules:
- id: cpp-avoid-stateful-stream-manipulators
  message: Use streams for ad-hoc, local, human-readable output. Avoid stateful manipulators
    (imbue, xalloc). Use absl::StreamFormat for formatting. Prefer absl::StrCat for
    string formatting.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $STREAM.imbue(...)
  - metavariable-type:
      metavariable: $STREAM
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern matches direct calls; may miss indirect usage.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect stateful manipulators.
    original_description: Use streams for ad-hoc, local, human-readable output. Avoid
      stateful manipulators (imbue, xalloc). Use absl::StreamFormat for formatting.
      Prefer absl::StrCat for string formatting.
