rules:
- id: java-text-block-opening-newline
  message: Opening triple quotes of a text block must be on a new line, following
    indentation rules or having no indentation.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: String $VAR = """$TEXT;
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $TEXT
      type: expr
  metadata:
    syntax_syntactic: opening_quotes_not_on_new_line
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise detection of newline after opening quotes
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for text block formatting
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires AST analysis for text block syntax
    original_description: Opening triple quotes of a text block must be on a new line,
      following indentation rules or having no indentation.
