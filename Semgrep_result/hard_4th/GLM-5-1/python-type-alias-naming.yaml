rules:
- id: python-type-alias-naming
  message: '[DISABLED] Type aliases must be named using CapWords convention. If the
    alias is private to the module, it must be prefixed with an underscore.'
  languages:
  - python
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Type aliases must be named using CapWords convention. If
      the alias is private to the module, it must be prefixed with an underscore.
