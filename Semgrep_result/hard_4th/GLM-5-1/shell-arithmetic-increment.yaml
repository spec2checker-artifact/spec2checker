rules:
- id: shell-arithmetic-increment
  message: Use `(( var += 3 ))` for incrementing variables. Do not use `$` inside
    the arithmetic expression `(( ))`.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: (( $VAR += $NUM ))
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $NUM
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep's shell support is experimental; pattern may not match
          all variations.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis.
    original_description: Use `(( var += 3 ))` for incrementing variables. Do not
      use `$` inside the arithmetic expression `(( ))`.
