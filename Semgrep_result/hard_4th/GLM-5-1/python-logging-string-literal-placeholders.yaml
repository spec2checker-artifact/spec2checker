rules:
- id: python-logging-string-literal-placeholders
  message: For logging functions that expect a pattern-string, always call them with
    a string literal (not f-string) as first argument.
  languages:
  - python
  severity: WARNING
  pattern-regex: ^__IMPOSSIBLE_MATCH_NEVER_FIRE__$
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: restricted to known logging object names and method names
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect logging calls with non-literal
          format strings
    original_description: For logging functions that expect a pattern-string, always
      call them with a string literal (not f-string) as first argument.
