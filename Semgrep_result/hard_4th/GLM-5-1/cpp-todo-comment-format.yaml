rules:
- id: cpp-todo-comment-format
  message: TODO comments should include TODO in all caps, followed by bug ID, name,
    email, or identifier.
  languages:
  - cpp
  severity: WARNING
  pattern: '# TODO: ...'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom regex for identifier validation
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support C/C++ analysis
    original_description: TODO comments should include TODO in all caps, followed
      by bug ID, name, email, or identifier.
