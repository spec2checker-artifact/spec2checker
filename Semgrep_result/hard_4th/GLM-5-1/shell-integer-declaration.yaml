rules:
- id: shell-integer-declaration
  message: '[DISABLED] Detect variable assignments that could be declared as integers
    using `declare -i` or `local -i`.'
  languages:
  - bash
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Detect variable assignments that could be declared as integers
      using `declare -i` or `local -i`.
