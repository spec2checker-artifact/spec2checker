rules:
- id: java-method-annotation-multiline
  message: Method and constructor annotations should each be on their own line by
    default, with an exception for a single parameterless annotation.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: '@$ANNOT1 @$ANNOT2

      $MODIFIERS $RETURN $METHOD($PARAMS) { ... }'
  - metavariable-type:
      metavariable: $ANNOT1
      type: expr
  - metavariable-type:
      metavariable: $ANNOT2
      type: expr
  - metavariable-type:
      metavariable: $METHOD
      type: function
  metadata:
    syntax_method: has_multiple_annotations
    syntax_annotation: annotation_has_parameters
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may not correctly identify all parameterless annotations
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for annotation formatting
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL is not designed for formatting/style rules
    original_description: Method and constructor annotations should each be on their
      own line by default, with an exception for a single parameterless annotation.
