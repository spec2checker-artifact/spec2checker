rules:
- id: python-no-spaces-around-equals
  message: Never use spaces around `=` when passing keyword arguments or defining
    default parameter values, unless a type annotation is present.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: "def $FUNC($...ARGS, $PARAM = $VALUE, $...ARGS2):\n    ..."
  - pattern-inside: '@true

      ...'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: true
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to match the specific spacing syntax; type annotation
          detection may be limited
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires custom query to detect spacing and exclude type-annotated
          parameters
    original_description: Never use spaces around `=` when passing keyword arguments
      or defining default parameter values, unless a type annotation is present.
