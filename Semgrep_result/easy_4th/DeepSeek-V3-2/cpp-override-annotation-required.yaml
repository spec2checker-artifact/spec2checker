rules:
- id: cpp-override-annotation-required
  message: '[DISABLED] Annotate overrides of virtual functions with `override` or
    `final`. Do not use `virtual` when declaring an override.'
  languages:
  - cpp
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Annotate overrides of virtual functions with `override`
      or `final`. Do not use `virtual` when declaring an override.
