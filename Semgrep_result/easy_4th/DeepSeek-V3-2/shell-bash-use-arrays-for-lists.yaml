rules:
- id: shell-bash-use-arrays-for-lists
  message: Bash arrays should be used to store lists of elements to avoid quoting
    complications.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $VAR=($ARGS); $CMD "${$VAR[@]}"
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $ARGS
      type: expr
  - metavariable-type:
      metavariable: $CMD
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match non-array usage or miss complex expansions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell/bash analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell/bash analysis
    original_description: Bash arrays should be used to store lists of elements to
      avoid quoting complications.
