rules:
- id: shell-braces-same-line-no-space
  message: Braces must be on the same line as the function name and no space between
    function name and parenthesis.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $RET $FUNC (...) {
  - metavariable-type:
      metavariable: $FUNC
      type: function
  - metavariable-type:
      metavariable: $RET
      type: expr
  metadata:
    syntax_function: has_parameter_list
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match non-function declarations
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for formatting
    original_description: Braces must be on the same line as the function name and
      no space between function name and parenthesis.
