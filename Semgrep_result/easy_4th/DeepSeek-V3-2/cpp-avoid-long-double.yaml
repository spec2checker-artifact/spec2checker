rules:
- id: cpp-avoid-long-double
  message: Use `float` and `double`; assume they represent IEEE-754 binary32 and binary64.
    Avoid `long double` as it is non-portable.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: long double $VAR;
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Use `float` and `double`; assume they represent IEEE-754
      binary32 and binary64. Avoid `long double` as it is non-portable.
