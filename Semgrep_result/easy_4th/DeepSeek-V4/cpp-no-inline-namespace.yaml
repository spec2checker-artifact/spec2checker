rules:
- id: cpp-no-inline-namespace
  message: Do not use inline namespaces.
  languages:
  - cpp
  severity: ERROR
  patterns:
  - pattern: inline namespace $NAME { ... }
  - metavariable-type:
      metavariable: $NAME
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires matching the 'inline' keyword
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Do not use inline namespaces.
