rules:
- id: cpp-no-nonstandard-extensions
  message: 'Do not use nonstandard extensions like __attribute__, #pragma, __COUNTER__,
    alloca(), variable-length arrays, etc.'
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $EXPR
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_$EXPR: matches_pattern('__attribute__|#pragma|__COUNTER__|alloca') OR is_variable_length_array_declaration
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires multiple patterns for different nonstandard extensions;
          VLA detection may be limited to simple cases
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom queries for each nonstandard extension
    original_description: 'Do not use nonstandard extensions like __attribute__, #pragma,
      __COUNTER__, alloca(), variable-length arrays, etc.'
