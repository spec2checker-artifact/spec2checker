rules:
- id: javascript-import-missing-js-extension
  message: ES module import paths must include the `.js` file extension.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: import $PATH;
  - metavariable-type:
      metavariable: $PATH
      type: expr
  metadata:
    syntax_$PATH: not matches_regex('\.js["']$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match dynamic imports or require statements
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for import path string analysis
    original_description: ES module import paths must include the `.js` file extension.
