rules:
- id: python-property-allowed-when-necessary
  message: Properties with non-trivial logic (loops, I/O, external calls) should be
    refactored to regular methods. Simple getters/setters are allowed.
  languages:
  - python
  severity: INFO
  patterns:
  - pattern-either:
    - pattern: |
        @property
        def $FUNC($ARGS):
            ...
            for $ITEM in $ITER:
                ...
    - pattern: |
        @property
        def $FUNC($ARGS):
            ...
            $OBJ.open(...)
    - pattern: |
        @property
        def $FUNC($ARGS):
            ...
            $OBJ.read(...)
    - pattern: |
        @property
        def $FUNC($ARGS):
            ...
            $OBJ.write(...)
  - pattern-not: |
      @property
      def $FUNC($ARGS):
          return $VAL
  - pattern-not: |
      @property
      def $FUNC($ARGS):
          return self.$ATTR
  - pattern-not: |
      @property
      def $FUNC($ARGS):
          return self.$ATTR.get(...)
  - pattern-not: |
      @property
      def $FUNC($ARGS):
          return self._$ATTR
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Only detects obvious non-trivial patterns (loops, I/O); simple
          getters will not be flagged.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can detect property usage but cannot automatically assess if
          logic is trivial.
    original_description: 'Properties may be used to control getting/setting attributes
      that require trivial computations or logic. Must match expectations: cheap,
      straightforward, unsurprising.'
