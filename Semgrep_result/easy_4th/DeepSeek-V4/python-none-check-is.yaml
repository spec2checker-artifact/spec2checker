rules:
- id: python-none-check-is
  message: Always use `if x is None` (or `is not None`) to check for `None`. Using
    `if not x:` is incorrect when `x` could be `0` or an empty string.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: |
      if not $X:
          ...
  - pattern-not: |
      if not isinstance($X, ...):
          ...
  - pattern-not: |
      if not $X.startswith(...):
          ...
  - pattern-not: |
      if not $X.endswith(...):
          ...
  - pattern-not: |
      if not len($X):
          ...
  - pattern-not: |
      if not $X in ...:
          ...
  - pattern-not: |
      if not $X == ...:
          ...
  - pattern-not: |
      if not $X != ...:
          ...
  - pattern-not: |
      if not $X.lower():
          ...
  - pattern-not: |
      if not $X.upper():
          ...
  - pattern-not: |
      if not $X.strip():
          ...
  - pattern-not: |
      if not $X.isdigit():
          ...
  - pattern-not: |
      if not $X.isalpha():
          ...
  - pattern-not: |
      if not $X.isspace():
          ...
  - pattern-not: |
      if not $X.isalnum():
          ...
  - pattern-not: |
      if not $X.is_available:
          ...
  - pattern-not: |
      if not $X.is_set:
          ...
  - pattern-not: |
      if not $X.is_none:
          ...
  - pattern-not: |
      if not $X.exists():
          ...
  - pattern-not: |
      if not $X.is_empty:
          ...
  - metavariable-regex:
      metavariable: $X
      regex: "^(user|result|response|obj|object|node|model|item|value|data|record|entry|row|doc|document|msg|message|conn|connection|client|session|ctx|context|req|request|resp|reply|ref|ptr|handle|token|ticket|task|job|worker|thread|proc|process|sock|socket|fp|file|dir|path|db|database|cursor|cache|lock|resource|handler|manager|loader|parser|adapter|proxy|factory|builder|visitor|observer|strategy|command|state|view|controller|component|widget|element|entity|instance|stub|mock|impl|alias|option|config|setting|spec|descriptor|profile|account|identity|principal|credential|cert|secret|key|grant|claim|role|permission|policy|rule|filter|validator|converter|formatter|encoder|decoder|mapper|serializer|reducer|collector|aggregator|router|dispatcher|invoker|executor|runner|scheduler|timer|counter|log|logger|report|metric|stat|health|status|signal|notification|alert|incident|error|exception|fault|failure|warning|alarm|queue|pipe|buffer|stream|channel|transport|bridge|gateway|cluster|pool|registry|repo|repository|store|vault|archive|backup|snapshot|version|revision|commit|branch|tag|release|build|deploy|artifact|package|module|plugin|extension|addon|feature|flag|toggle|switch|param|parameter|argument|input|output|callback|hook|trigger|event|action|operation|method|function|procedure|routine|service|endpoint|api|interface|contract|protocol|schema|format|template|layout|pattern|style|theme|content|text|string|number|digit|fraction|ratio|percent|angle|coord|point|vector|matrix|tensor|array|list|dict|map|set|tuple|range|slice|index|offset|size|length|width|height|depth|volume|area|perimeter|radius|diameter|scale|factor|rate|speed|velocity|acceleration|force|weight|mass|density|pressure|temperature|energy|power|voltage|current|charge|frequency|period|duration|interval|timeout|deadline|timestamp|date|time|epoch|locale|lang|encoding|charset|type|kind|category|class|grade|level|tier|rank|score|rating|priority|severity|importance|urgency|status_code|http_code|exit_code|error_code|reaso