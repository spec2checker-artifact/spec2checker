  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Uses heuristic variable naming to filter; may still produce some
          false positives/negatives.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: Requires type tracking to determine if $X could be None, 0, or
          empty string.
    original_description: Always use `if x is None` (or `is not None`) to check for
      None. Using `if not x:` is incorrect when `x` could be `0` or an empty string.
