rules:
- id: python-default-iterator
  message: Do not modify a container while iterating over it. This causes undefined
    behavior.
  languages:
  - python
  severity: WARNING
  pattern-either:
  - pattern: |
      for $ITEM in $CONT:
          ...
          $CONT.append($X)
  - pattern: |
      for $ITEM in $CONT:
          ...
          $CONT.remove($X)
  - pattern: |
      for $ITEM in $CONT:
          ...
          $CONT.pop()
  - pattern: |
      for $ITEM in $CONT:
          ...
          $CONT.insert($X, $Y)
  - pattern: |
      for $ITEM in $CONT:
          ...
          $CONT.clear()
  - pattern: |
      for $ITEM in $CONT:
          ...
          del $CONT[$X]
  - pattern-not: |
      for $ITEM in $CONT:
          ...
          $RESULT = $CONT.append($X)
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: true
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Only detects common mutation patterns within for loops.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires type inference for accurate detection
    original_description: Use default iterators and operators for types that support
      them (lists, dicts, files). Do not mutate container while iterating.
