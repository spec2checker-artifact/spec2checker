rules:
- id: java-empty-block-multiblock
  message: Empty block may be {} with no characters or line break in between, unless
    part of multi-block statement (if/else, try/catch/finally). In multi-block statement,
    concise empty block not allowed.
  languages:
  - java
  severity: WARNING
  pattern-either:
  - patterns:
    - pattern: "try { } catch ($TYPE $E) { ... }"
    - pattern-not: "try { // ... } catch ($TYPE $E) { ... }"
  - patterns:
    - pattern: "try { ... } catch ($TYPE $E) { }"
    - pattern-not: "try { ... } catch ($TYPE $E) { // ... }"
  - patterns:
    - pattern: "try { } finally { ... }"
  - patterns:
    - pattern: "try { ... } catch ($TYPE1 $E1) { ... } catch ($TYPE2 $E2) { }"
    - pattern-not: "try { ... } catch ($TYPE1 $E1) { ... } catch ($TYPE2 $E2) { // ... }"
  metadata:
    syntax_block: is_part_of_multi_block
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires context to detect surrounding if/else or try/catch/finally
          structure
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not have a built-in rule for this specific multi-block
          empty block pattern; requires custom XPath
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect multi-block context
    original_description: Empty block may be {} with no characters or line break in
      between, unless part of multi-block statement (if/else, try/catch/finally).
      In multi-block statement, concise empty block not allowed.