rules:
- id: python-property-decorator-required
  message: Properties should be created with the `@property` decorator. Manual descriptor
    implementation is a power feature and should be flagged.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: "def $PROP(...):\n    ..."
  - metavariable-regex:
      metavariable: $PROP
      regex: ^[a-z_][a-z0-9_]*$
  - pattern-inside: '@true

      ...'
  metadata:
    syntax_$PROP: first_parameter_name('self')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cannot reliably detect manual descriptor implementation vs. regular
          method; rule is a heuristic for missing @property.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect missing @property on getter-like
          methods.
    original_description: Properties should be created with the `@property` decorator.
      Manual descriptor implementation is a power feature and should be flagged.
