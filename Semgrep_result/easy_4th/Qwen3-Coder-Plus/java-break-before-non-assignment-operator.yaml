rules:
- id: java-break-before-non-assignment-operator
  message: When a line is broken at a non-assignment operator, the line break must
    come before the operator.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: $EXPR $OP $EXPR
  - metavariable-regex:
      metavariable: $OP
      regex: '[+\-*/%&|^]|&&|\|\||<<|>>|>>>|instanceof'
  metadata:
    syntax_$OP: is_line_break_before
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom metavariable matching for operators and line
          break detection
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for operator line break formatting
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL is not designed for formatting rule detection
    original_description: When a line is broken at a non-assignment operator, the
      line break must come before the operator.
