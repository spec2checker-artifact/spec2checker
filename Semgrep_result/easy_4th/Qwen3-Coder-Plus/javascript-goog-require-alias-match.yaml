rules:
- id: javascript-goog-require-alias-match
  message: When `goog.require` is assigned to a single constant alias, the alias name
    must match the final dot-separated component of the namespace string.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: const $ALIAS = goog.require($NAMESPACE);
  - metavariable-type:
      metavariable: $ALIAS
      type: expr
  - metavariable-type:
      metavariable: $NAMESPACE
      type: expr
  metadata:
    syntax_$NAMESPACE: is_string_literal
    syntax_$ALIAS: is_identifier
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom logic to compare alias name with final namespace
          component
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to enforce naming rule
    original_description: When `goog.require` is assigned to a single constant alias,
      the alias name must match the final dot-separated component of the namespace
      string.
