rules:
- id: javascript-no-jsdoc-for-implementation
  message: Do not use JSDoc-style comments (`/** ... */`) for implementation comments;
    use `/* ... */` or `//` instead. JSDoc is reserved for documentation.
  languages:
  - javascript
  severity: WARNING
  pattern: '** ... *'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match valid JSDoc documentation comments; requires
          additional context to distinguish
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to differentiate comment purpose
    original_description: Do not use JSDoc-style comments (`/** ... */`) for implementation
      comments; use `/* ... */` or `//` instead. JSDoc is reserved for documentation.
