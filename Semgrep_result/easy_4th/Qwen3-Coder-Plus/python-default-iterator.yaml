rules:
- id: python-default-iterator
  message: Use default iterators and operators for types that support them (lists,
    dicts, files). Do not mutate container while iterating.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: "for $KEY in $DICT.keys():\n    ..."
  - metavariable-regex:
      metavariable: $DICT
      regex: ^__never_match__$
  metadata:
    type_constraint_$DICT: is_instance_of('dict')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: true
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: type constraint may require type resolution for complex expressions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires type inference for accurate detection
    original_description: Use default iterators and operators for types that support
      them (lists, dicts, files). Do not mutate container while iterating.