rules:
- id: cpp-prefix-increment-decrement
  message: Use prefix form (++i, --i) for increment/decrement operators unless the
    old value is needed, as prefix is never less efficient.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $EXPR $OP $EXPR2
  - metavariable-regex:
      metavariable: $OP
      regex: i\+\+|i--
  metadata:
    syntax_$OP: is_postfix_inc_dec
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern may match valid postfix usage; requires manual review
          to confirm old value is not needed.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect unnecessary postfix usage.
    original_description: Use prefix form (++i, --i) for increment/decrement operators
      unless the old value is needed, as prefix is never less efficient.
