rules:
- id: python-property-allowed-when-necessary
  message: 'Property with non-trivial logic detected. Consider whether a simple attribute
    would suffice.'
  languages:
  - python
  severity: INFO
  patterns:
  - pattern: |
      @property
      def $FUNC(self):
          ...
  - pattern-not: |
      @property
      def $FUNC(self):
          return self._$ATTR
  - pattern-not: |
      @property
      def $FUNC(self):
          return self.$ATTR
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cannot automatically verify property logic is trivial/cheap;
          requires manual review.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can detect property usage but cannot automatically assess if
          logic is trivial.
    original_description: 'Properties may be used to control getting/setting attributes
      that require trivial computations or logic. Must match expectations: cheap,
      straightforward, unsurprising.'
