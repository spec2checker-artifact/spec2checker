rules:
- id: java-dot-separator-break
  message: Detect dot separator (.) with a line break before it, as in 'object .method()'.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: '$OBJ

      .$METHOD(...)'
  - metavariable-type:
      metavariable: $OBJ
      type: expr
  - metavariable-type:
      metavariable: $METHOD
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not have a built-in rule for this specific dot-separator
          line break; requires custom rule
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for whitespace detection
    original_description: Detect dot separator (.) with a line break before it, as
      in 'object .method()'.
