rules:
- id: java-test-class-name
  message: Test class name must end with 'Test'. If it covers a single class, the
    name should be that class plus 'Test'.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: class $CLASS { ... }
  - metavariable-type:
      metavariable: $CLASS
      type: type
  metadata:
    syntax_$CLASS: name_ends_with('Test')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cannot enforce the 'single class plus Test' naming convention
          without cross-file analysis.
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom rule to check class name suffix.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to check naming pattern; the 'single class
          plus Test' convention is semantic and not fully enforceable.
    original_description: Test class name must end with 'Test'. If it covers a single
      class, the name should be that class plus 'Test'.
