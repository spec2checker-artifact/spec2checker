rules:
- id: python-avoid-staticmethod
  message: Never use `staticmethod` unless forced. Write a module-level function instead.
  languages:
  - python
  severity: WARNING
  pattern: "@staticmethod\ndef $FUNC(...):\n    ..."
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect staticmethod usage
    original_description: Never use `staticmethod` unless forced. Write a module-level
      function instead.
