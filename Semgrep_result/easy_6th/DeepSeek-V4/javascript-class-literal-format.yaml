rules:
- id: javascript-class-literal-format
  message: Class literals must be indented as blocks. Do not add semicolons after
    methods or after the closing brace of a class declaration. Class expressions are
    still terminated with a semicolon.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: "class $CLASS {\n  $METHOD(...) {\n    ...\n  };\n}"
  - metavariable-type:
      metavariable: $CLASS
      type: type
  - metavariable-type:
      metavariable: $METHOD
      type: function
  metadata:
    syntax_class: is_class_declaration
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern may match class expressions incorrectly; requires distinction
          between declaration and expression.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect semicolons after methods in class
          declarations.
    original_description: Class literals must be indented as blocks. Do not add semicolons
      after methods or after the closing brace of a class declaration. Class expressions
      are still terminated with a semicolon.
