rules:
- id: javascript-source-file-structure-sections-order
  message: 'Files must consist of sections in the following order: license/copyright
    (if present), `@fileoverview` JSDoc (if present), `goog.module` statement (if
    applicable), ES `import` statements, `goog.require`/`goog.requireType` statements,
    file implementation. Exactly one blank line separates sections except implementation
    may have 1-2 blank lines.'
  languages:
  - javascript
  severity: WARNING
  pattern: goog.module.declareLegacyNamespace();
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom rule for file structure validation, not a simple
          pattern.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query for file structure and whitespace analysis.
    original_description: 'Files must consist of sections in the following order:
      license/copyright (if present), `@fileoverview` JSDoc (if present), `goog.module`
      statement (if applicable), ES `import` statements, `goog.require`/`goog.requireType`
      statements, file implementation. Exactly one blank line separates sections except
      implementation may have 1-2 blank lines.'
