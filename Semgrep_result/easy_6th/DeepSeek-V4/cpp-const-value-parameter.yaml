rules:
- id: cpp-const-value-parameter
  message: For a function parameter passed by value, `const` has no effect on the
    caller, thus not recommended in function declarations.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: void $FUNC(const $TYPE $PARAM);
  - metavariable-type:
      metavariable: $FUNC
      type: function
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $PARAM
      type: expr
  metadata:
    syntax_$PARAM: is_value_parameter
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: true
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires type resolution to confirm parameter is passed by value
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: true
    original_description: For a function parameter passed by value, `const` has no
      effect on the caller, thus not recommended in function declarations.
