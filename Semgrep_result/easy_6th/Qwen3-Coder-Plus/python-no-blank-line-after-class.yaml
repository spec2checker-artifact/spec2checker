rules:
- id: python-no-blank-line-after-class
  message: No blank line following a `class` line. The line after the class definition
    must be a docstring or code.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: class $CLASS:
  - pattern-not-inside: |
      class $CLASS:
          """$DOCSTRING"""
  - pattern-not-inside: |
      class $CLASS:
          $ATTR = ...
  - pattern-not-inside: |
      class $CLASS:
          pass
  - pattern-not-inside: |
      class $CLASS($PARENT):
          """$DOCSTRING"""
  - pattern-not-inside: |
      class $CLASS($PARENT):
          $ATTR = ...
  - pattern-not-inside: |
      class $CLASS($PARENT):
          pass
  - pattern-not-inside: |
      @decorator
      class $CLASS:
          """$DOCSTRING"""
  - pattern-not-inside: |
      @decorator
      class $CLASS:
          $ATTR = ...
  - pattern-not-inside: |
      @decorator
      class $CLASS:
          pass
  - pattern-not-inside: |
      @decorator
      class $CLASS($PARENT):
          """$DOCSTRING"""
  - pattern-not-inside: |
      @decorator
      class $CLASS($PARENT):
          $ATTR = ...
  - pattern-not-inside: |
      @decorator
      class $CLASS($PARENT):
          pass
  - metavariable-regex:
      metavariable: $CLASS
      regex: ^(?!\s*$).+
  metadata:
    syntax_class: next_sibling_is_blank_line
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Uses pattern-not-inside exclusions to approximate blank-line detection; cannot
          perfectly distinguish blank lines from non-blank lines due to AST normalization.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to check for blank lines after class definitions.
    original_description: No blank line following a `class` line. The line after the
      class definition must be a docstring or code.