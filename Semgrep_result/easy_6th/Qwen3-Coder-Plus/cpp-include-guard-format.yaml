rules:
- id: cpp-include-guard-format
  message: 'Use #define guards with format <PROJECT>_<PATH>_<FILE>_H_ based on full
    path in source tree. Guard name does not end with _H_.'
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: '#ifndef $GUARD

      #define $GUARD

      ...

      #endif'
  - metavariable-regex:
      metavariable: $GUARD
      regex: ^(?!.*_H_$)[A-Z][A-Z0-9_]*$
  metadata:
    syntax_$GUARD: name_matches_regex('^[A-Z][A-Z0-9_]*_H_$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: cannot enforce guard name matches full source tree path
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check guard name format
    original_description: 'Use #define guards with format <PROJECT>_<PATH>_<FILE>_H_
      based on full path in source tree.'