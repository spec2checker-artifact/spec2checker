rules:
- id: cpp-const-placement-consistency
  message: Detect inconsistent placement of the `const` qualifier in pointer declarations.
    While `const int*` is preferred, `int const*` is allowed, but usage must be consistent
    within the same context.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $TYPE const* $VAR;
  - metavariable-type:
      metavariable: $TYPE
      type: expr
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can detect the pattern but cannot enforce consistency across
          a codebase without custom logic.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Can query for the pattern, but consistency checking requires
          cross-file analysis and is complex.
    original_description: Detect inconsistent placement of the `const` qualifier in
      pointer declarations. While `const int*` is preferred, `int const*` is allowed,
      but usage must be consistent within the same context.
