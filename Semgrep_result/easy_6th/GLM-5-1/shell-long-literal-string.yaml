rules:
- id: shell-long-literal-string
  message: If you have literal strings longer than 80 characters, use a here document
    or an embedded newline.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $VAR="$STRING"
  - metavariable-type:
      metavariable: $STRING
      type: expr
  metadata:
    syntax_$STRING: length > 80 AND no_newline
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise string length detection which may be approximate
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell/bash analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell/bash analysis
    original_description: If you have literal strings longer than 80 characters, use
      a here document or an embedded newline.
