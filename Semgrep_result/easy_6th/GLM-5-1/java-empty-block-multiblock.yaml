rules:
- id: java-empty-block-multiblock
  message: In multi-block statement (if/else, try/catch/finally), concise empty block not allowed. Empty catch or finally blocks should contain a comment or code. Private constructors, abstract methods, and empty method stubs are excluded.
  languages:
  - java
  severity: WARNING
  pattern-either:
  - patterns:
    - pattern-regex: 'catch\s*\([^)]*\)\s*\{\s*\}'
  - patterns:
    - pattern-regex: 'try\s*\{\s*\}'
  metadata:
    syntax_block: is_part_of_multi_block
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: false
        needs_type_solver: false
        full_support: true
        limitations: uses regex patterns to match only completely empty catch/try blocks in Java (no comments inside)
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: custom PMD rule can detect empty catch blocks within try/catch context
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect multi-block context
    original_description: Empty block may be {} with no characters or line break in
      between, unless part of multi-block statement (if/else, try/catch/finally).
      In multi-block statement, concise empty block not allowed.