rules:
- id: java-single-top-level-class
  message: '[DISABLED] Each source file must contain exactly one top-level class declaration.'
  languages:
  - java
  severity: ERROR
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: Each source file must contain exactly one top-level class
      declaration.
