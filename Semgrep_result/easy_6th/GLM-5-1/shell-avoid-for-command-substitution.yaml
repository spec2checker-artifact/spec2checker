rules:
- id: shell-avoid-for-command-substitution
  message: Avoid using `for var in $(...)` as it splits output by whitespace, not
    by line. Use `while read` or `readarray` instead. Only safe if the command output
    contains no unexpected whitespace.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: "for $VAR in $(...); do\n    ...\ndone"
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match safe uses where whitespace is controlled
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Avoid using `for var in $(...)` as it splits output by whitespace,
      not by line. Use `while read` or `readarray` instead. Only safe if the command
      output contains no unexpected whitespace.
