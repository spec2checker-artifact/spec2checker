rules:
- id: cpp-include-guard-format
  message: 'Include guard does not follow format <PROJECT>_<PATH>_<FILE>_H_ based on full path in source tree. Guard names must have at least 3 underscore-separated segments (e.g. PROJECT_PATH_FILE_H_).'
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: '#ifndef $GUARD

      #define $GUARD

      ...

      #endif'
  - metavariable-regex:
      metavariable: $GUARD
      regex: ^(?!([A-Z][A-Z0-9]*_){2,}[A-Z0-9]+_H_).+
  metadata:
    syntax_$GUARD: name_matches_regex('^([A-Z][A-Z0-9]*_){2,}[A-Z0-9]+_H_$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: cannot enforce guard name matches full source tree path; requires at least 3 path segments
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check guard name format with path segment count
    original_description: 'Use #define guards with format <PROJECT>_<PATH>_<FILE>_H_ based on full path in source tree.'