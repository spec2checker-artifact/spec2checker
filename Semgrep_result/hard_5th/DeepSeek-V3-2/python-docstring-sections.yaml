rules:
- id: python-docstring-sections
  message: Function docstring must contain sections for Args, Returns (or Yields),
    and Raises with appropriate hanging indent.
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: |
      def $FUNC($A, $B, ...):
          """$DOC
          ...
          """
          ...
  - metavariable-regex:
      metavariable: $FUNC
      regex: ^(?!_)(?!test_)[a-z][a-z0-9_]*$
  - pattern-not-regex: '@property'
  - pattern-not-regex: '@classmethod'
  - pattern-not-regex: '@staticmethod'
  - pattern-not-regex: '@field_validator'
  - pattern-not-regex: '@validator'
  - pattern-not-regex: '@trace_method'
  - pattern-not-regex: '@abstractmethod'
  - pattern-not-regex: '@pytest.fixture'
  - pattern-not-regex: '@router\.'
  - pattern-not-regex: '@login_manager\.'
  - pattern-not-regex: 'Args:'
  - pattern-not-regex: 'Returns:'
  - pattern-not-regex: 'Raises:'
  - pattern-not-regex: 'Yields:'
  - pattern-not-regex: 'See base class'
  - pattern-not-regex: 'see base class'
  metadata:
    syntax_$DOC: not_contains_section('Raises')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: cannot fully validate section content and hanging indent format
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for docstring structure validation
    original_description: Function docstring must contain sections for Args, Returns
      (or Yields), and Raises with appropriate hanging indent.