rules:
- id: python-docstring-sections
  message: Function docstring should contain sections for Args, Returns (or Yields),
    and Raises with appropriate hanging indent for complex functions.
    Single-line docstrings for simple functions are exempt.
  languages:
  - python
  severity: INFO
  patterns:
  - pattern: |
      def $FUNC(...):
          """$DOC"""
          ...
  - pattern-not: |
      def $FUNC(...):
          """$DOC"""
  - metavariable-regex:
      metavariable: $FUNC
      regex: "^[a-z]"
  - metavariable-regex:
      metavariable: $DOC
      regex: "(?s).{200,}"
  - metavariable-not-regex:
      metavariable: $DOC
      regex: "^See "
  metadata:
    syntax_$DOC: not_contains_section('Raises')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: cannot fully validate section content and hanging indent format
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Python analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query for docstring structure validation
    original_description: Function docstring must contain sections for Args, Returns
      (or Yields), and Raises with appropriate hanging indent.