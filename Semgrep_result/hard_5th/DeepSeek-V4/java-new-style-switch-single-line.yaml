rules:
- id: java-new-style-switch-single-line
  message: New-style switch rule can be written on a single line if it follows Google
    style (no column overflow; if non-empty block, line break after {). Continuation
    lines indent +4.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: case $LABEL -> $EXPR;
  - metavariable-type:
      metavariable: $LABEL
      type: expr
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    syntax_switch_expression: is_new_style_switch
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: formatting rules (line length, indentation) require custom checks
          beyond AST matching
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule for line length and block formatting
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: formatting rules are not a primary focus of CodeQL
    original_description: New-style switch rule can be written on a single line if
      it follows Google style (no column overflow; if non-empty block, line break
      after {). Continuation lines indent +4.
