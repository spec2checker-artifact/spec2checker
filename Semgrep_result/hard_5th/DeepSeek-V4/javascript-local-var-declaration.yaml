rules:
- id: javascript-local-var-declaration
  message: Declare all local variables with `const` or `let`. Use `const` by default
    unless variable needs reassignment. `var` must not be used.
  languages:
  - javascript
  severity: ERROR
  patterns:
  - pattern: var $VAR = $EXPR;
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: true
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: true
    original_description: Declare all local variables with `const` or `let`. Use `const`
      by default unless variable needs reassignment. `var` must not be used.
