rules:
- id: python-docstring-omit-return-none
  message: '[DISABLED] The Returns section is not required if the function only returns
    None.'
  languages:
  - python
  severity: WARNING
  pattern: __DISABLED_NO_PATTERN__
  metadata:
    disabled: true
    reason: Rule requires capabilities beyond Semgrep (type resolution, scope analysis,
      complex syntax, or unreliable import organization)
    original_description: The Returns section is not required if the function only
      returns None.
