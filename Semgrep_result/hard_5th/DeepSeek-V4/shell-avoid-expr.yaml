rules:
- id: shell-avoid-expr
  message: Avoid using the external program `expr` for arithmetic; built-in shell
    arithmetic is many times faster.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: expr $EXPR
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern may match non-arithmetic uses of expr (e.g., string operations)
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Avoid using the external program `expr` for arithmetic;
      built-in shell arithmetic is many times faster.
