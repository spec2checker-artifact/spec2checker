rules:
- id: java-overloads-never-split
  message: Methods with the same name must appear in a single contiguous group with
    no other members in between. Same for constructors. Applies even when modifiers
    differ.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: "class $CLASS {\n    ...\n    $MODIFIERS $RETURN $NAME($PARAMS) { ...\
      \ }\n    ...\n    $MODIFIERS2 $RETURN2 $NAME($PARAMS2) { ... }\n    ...\n}"
  - metavariable-type:
      metavariable: $CLASS
      type: type
  - metavariable-type:
      metavariable: $NAME
      type: function
  metadata:
    syntax_method: same_name_methods_not_contiguous
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom logic to detect non-contiguous groups of same-name
          methods
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom rule implementation
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires query to check ordering of class members
    original_description: Methods with the same name must appear in a single contiguous
      group with no other members in between. Same for constructors. Applies even
      when modifiers differ.
