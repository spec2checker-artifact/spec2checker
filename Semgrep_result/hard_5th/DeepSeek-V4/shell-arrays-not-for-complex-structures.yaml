rules:
- id: shell-arrays-not-for-complex-structures
  message: Arrays should not be used to facilitate more complex data structures; use
    appropriate collection types instead.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: $VAR=(...)
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: pattern matches array declarations but cannot infer if they are
          used for complex structures
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Arrays should not be used to facilitate more complex data
      structures; use appropriate collection types instead.
