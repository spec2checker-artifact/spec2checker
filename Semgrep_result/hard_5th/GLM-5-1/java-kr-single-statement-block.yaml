rules:
- id: java-kr-single-statement-block
  message: Detects a block used where a single statement is allowed, which is permitted
    by K&R style to limit local variable scope.
  languages:
  - java
  severity: WARNING
  pattern: "{\n  $...;\n}"
  metadata:
    syntax_block: parent_is_single_statement_context
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise detection of single-statement contexts (e.g.,
          after if, for, while)
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD's rule 'UnnecessaryBlock' flags the opposite case; custom
          rule needed for this exception.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to identify blocks in single-statement
          contexts
    original_description: Detects a block used where a single statement is allowed,
      which is permitted by K&R style to limit local variable scope.
