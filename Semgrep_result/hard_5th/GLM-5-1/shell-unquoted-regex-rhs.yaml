rules:
- id: shell-unquoted-regex-rhs
  message: When using the regex matching operator `=~` inside `[[ ... ]]`, the right-hand
    side (RHS) should not be quoted, as quoting would treat the pattern as a literal
    string.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: '[[ $LHS =~ "$RHS" ]]'
  - metavariable-type:
      metavariable: $LHS
      type: expr
  - metavariable-type:
      metavariable: $RHS
      type: expr
  metadata:
    syntax_$RHS: is_quoted
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Semgrep's Bash/Shell parsing may not fully distinguish all quoting
          contexts for regex patterns.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support Shell/Bash analysis.
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support Shell/Bash analysis.
    original_description: When using the regex matching operator `=~` inside `[[ ...
      ]]`, the right-hand side (RHS) should not be quoted, as quoting would treat
      the pattern as a literal string.
