rules:
- id: cpp-explicit-single-argument-constructor
  message: Type conversion operators and constructors callable with a single argument
    must be marked explicit. Copy/move constructors are exceptions.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern: $CLASS::$CLASS($ARG) { ... }
  - metavariable-type:
      metavariable: $CLASS
      type: type
  - metavariable-type:
      metavariable: $ARG
      type: expr
  - pattern-inside: '@false

      ...'
  metadata:
    syntax_constructor: parameter_count == 1
    type_constraint_constructor: is_copy_or_move_constructor == false
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: true
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires type resolution to identify copy/move constructors and
          to confirm single-argument callability
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis
      codeql:
        partial_support: true
        needs_type_solver: true
        full_support: false
        limitations: requires custom query to detect missing explicit and exclude
          copy/move constructors
    original_description: Type conversion operators and constructors callable with
      a single argument must be marked explicit. Copy/move constructors are exceptions.
