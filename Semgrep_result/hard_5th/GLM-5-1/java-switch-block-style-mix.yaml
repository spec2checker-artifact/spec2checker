rules:
- id: java-switch-block-style-mix
  message: Detect mixing of new-style switch rules (label ->) and old-style statement
    groups (label:) within the same switch block.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: "switch ($EXPR) {\n    $...BODY\n}"
  - metavariable-type:
      metavariable: $EXPR
      type: expr
  - metavariable-type:
      metavariable: $...BODY
      type: expr
  metadata:
    syntax_$...BODY: contains_pattern('case $L:')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern matching for both switch rule and statement
          group syntax
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD may have existing rules for switch style but not specifically
          for mixing
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires AST query to differentiate switch case types
    original_description: Detect mixing of new-style switch rules (label ->) and old-style
      statement groups (label:) within the same switch block.
