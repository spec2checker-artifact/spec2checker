rules:
- id: shell-arithmetic-comparison-no-dollar
  message: Inside arithmetic evaluation `(( ... ))`, variables should be referenced
    by name without the `$` prefix.
  languages:
  - bash
  severity: WARNING
  patterns:
  - pattern: if (( $${VAR} $OP $${VAR2} )); then
  - metavariable-type:
      metavariable: $VAR
      type: expr
  - metavariable-type:
      metavariable: $VAR2
      type: expr
  - metavariable-type:
      metavariable: $OP
      type: expr
  metadata:
    syntax_$VAR: name_starts_with('$')
    syntax_$VAR2: name_starts_with('$')
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise pattern for variable names with $ prefix
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell script analysis
    original_description: Inside arithmetic evaluation `(( ... ))`, variables should
      be referenced by name without the `$` prefix.
