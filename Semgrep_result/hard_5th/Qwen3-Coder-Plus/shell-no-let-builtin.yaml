rules:
- id: shell-no-let-builtin
  message: Never use the `let` builtin. Use `(( ... ))` instead.
  languages:
  - bash
  severity: ERROR
  patterns:
  - pattern: let $VAR
  - metavariable-type:
      metavariable: $VAR
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires semgrep-shell support for builtin detection
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell analysis
      codeql:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: CodeQL does not support shell analysis
    original_description: Never use the `let` builtin. Use `(( ... ))` instead.
