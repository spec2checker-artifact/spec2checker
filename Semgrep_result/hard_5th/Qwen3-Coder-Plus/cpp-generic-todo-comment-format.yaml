rules:
- id: cpp-generic-todo-comment-format
  message: TODO comments must include 'TODO' in all caps, followed by a bug ID, name,
    email, or other identifier, and include a specific date or event.
  languages:
  - cpp
  severity: WARNING
  patterns:
  - pattern-regex: '//\s*TODO\s*.*'
  - pattern-not-regex: '//\s*TODO\s*\([^)]+\)\s*:.*(?:20\d\d|19\d\d|January|February|March|April|May|June|July|August|September|October|November|December|next|after|before|by|until|deadline|expire|remove|deprecate)'
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Pattern matches only simple '// TODO:' prefix; complex format
          validation (identifier, date) requires custom logic.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support C/C++ analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to enforce specific comment content format.
    original_description: TODO comments must include 'TODO' in all caps, followed
      by a bug ID, name, email, or other identifier, and include a specific date or
      event.
    iteration2_note: Narrowed pattern-not-regex to exclude TODO comments containing dates (year patterns 20xx/19xx, month names, temporal keywords). 87.5% precision per evaluate2. Only 1 FP remaining (sample6 had date 'October 2025').
