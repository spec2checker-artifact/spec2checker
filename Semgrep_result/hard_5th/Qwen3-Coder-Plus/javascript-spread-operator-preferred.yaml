rules:
- id: javascript-spread-operator-preferred
  message: Use spread operator `...` to flatten iterables. Prefer over `Array.prototype.slice`
    or `concat`. No space after `...`.
  languages:
  - javascript
  severity: WARNING
  patterns:
  - pattern: $ARRAY.slice($START, $END)
  - metavariable-type:
      metavariable: $ARRAY
      type: expr
  - metavariable-type:
      metavariable: $START
      type: expr
  - metavariable-type:
      metavariable: $END
      type: expr
  metadata:
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Cannot enforce preference; only detects slice usage.
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support JavaScript analysis.
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: Requires custom query to detect slice/concat usage and suggest
          spread.
    original_description: Use spread operator `...` to flatten iterables. Prefer over
      `Array.prototype.slice` or `concat`. No space after `...`.
