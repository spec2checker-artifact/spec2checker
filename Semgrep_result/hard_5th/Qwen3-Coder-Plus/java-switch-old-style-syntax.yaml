rules:
- id: java-switch-old-style-syntax
  message: Detect use of old-style colon syntax in switch statements where new-style
    arrow syntax is required (e.g., in switch expressions).
  languages:
  - java
  severity: ERROR
  patterns:
  - pattern: 'case $LABEL:'
  - metavariable-type:
      metavariable: $LABEL
      type: expr
  metadata:
    syntax_switch: is_switch_expression
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires precise detection of switch expression context
      pmd:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: PMD has rules for switch syntax but may not distinguish expression
          context
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to detect colon in switch expressions
    original_description: Detect use of old-style colon syntax in switch statements
      where new-style arrow syntax is required (e.g., in switch expressions).
