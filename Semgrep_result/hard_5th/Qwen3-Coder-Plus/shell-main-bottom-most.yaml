rules:
- id: shell-main-bottom-most
  message: The main program should be in a function called 'main' defined as the bottom-most
    function in the file.
  languages:
  - bash
  severity: WARNING
  pattern: "main() {\n    ...\n}"
  metadata:
    syntax_function: is_not_last_function_in_file
    capabilities_required:
      cross_file: false
      inheritance_analysis: false
      dataflow: false
      type_resolution: false
    backend_hints:
      semgrep:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires pattern to check relative position of function definitions
      pmd:
        partial_support: false
        needs_type_solver: false
        full_support: false
        limitations: PMD does not support shell script analysis
      codeql:
        partial_support: true
        needs_type_solver: false
        full_support: false
        limitations: requires custom query to check function ordering
    original_description: The main program should be in a function called 'main' defined
      as the bottom-most function in the file.
